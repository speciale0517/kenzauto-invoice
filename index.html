<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ケンズオート 請求書アプリ</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0; background:#eeeeea; font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif; color:#222;}
  button{cursor:pointer; font-family:inherit;}
  input, select{font-family:inherit; font-size:14px;}

  /* ── トップナビ ── */
  .topnav{position:sticky; top:0; z-index:60; background:#1c2430; color:#fff;
    padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .topnav h1{font-size:14px; font-weight:700; margin:0;}
  .tabs{display:flex; gap:4px; margin-left:8px;}
  .tabs button{padding:8px 16px; border:none; border-radius:5px; font-size:13px; font-weight:600;
    background:#2b3444; color:#bbb; min-height:44px;}
  .tabs button.active{background:#3a4658; color:#fff;}
  .topnav .spacer{flex:1;}
  .btn-primary{padding:8px 16px; border:none; border-radius:5px; font-size:13px; font-weight:700;
    background:linear-gradient(135deg,#e7c578,#b8942c); color:#1c2430;}
  .btn-ghost{padding:8px 14px; border:1px solid #555; border-radius:5px; font-size:13px; font-weight:600;
    background:transparent; color:#ddd; min-height:44px;}
  .toast{position:fixed; top:56px; left:50%; transform:translateX(-50%); background:#1c2430; color:#fff;
    padding:8px 18px; border-radius:20px; font-size:13px; z-index:200; box-shadow:0 4px 16px rgba(0,0,0,.3);
    opacity:0; pointer-events:none; transition:opacity .25s;}
  .toast.show{opacity:1;}

  .view{display:none;}
  .view.active{display:block;}

  /* ── 請求書作成：2ペイン ── */
  #view-create.active{display:flex; gap:0; align-items:flex-start;}
  .form-pane{width:46%; min-width:380px; max-width:560px; padding:16px 16px 60px; height:calc(100vh - 46px); overflow-y:auto;}
  .preview-pane{flex:1; position:sticky; top:46px; height:calc(100vh - 46px); overflow-y:auto;
    display:flex; flex-direction:column; align-items:center; padding:20px 12px; background:#e2e2dd;}
  @media (max-width:900px){
    #view-create{flex-direction:column;}
    .form-pane, .preview-pane{width:100%; max-width:none; min-width:0; height:auto; position:static;}
    /* 保存/印刷/共有ボタンを画面下部固定にし、長いフォームでも親指が届く範囲に配置する（CLAUDE.md 4章・第5回修正） */
    .form-pane{padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px));}
    .form-pane .action-bar{
      position:fixed; left:0; right:0; bottom:0; z-index:55;
      margin:0; padding:8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
      background:#fff; box-shadow:0 -2px 10px rgba(0,0,0,.12);
    }
  }

  .fsec{background:#fff; border-radius:8px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .fsec h2{font-size:13px; font-weight:700; margin:0 0 10px; color:#1c2430; border-left:4px solid #b8942c; padding-left:8px;}
  /* お客様情報見出しの横にクリアボタンを並べる行（第2回修正：クリアボタンをお客様情報欄横に移動） */
  .fsec-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .fsec-head h2{margin:0;}
  .clear-inline{flex-shrink:0; min-height:44px; padding:8px 14px; border:none; border-radius:6px; background:#f0e0e0; color:#a33; font-size:12px; font-weight:700;}
  .frow{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
  .frow label{width:104px; flex-shrink:0; font-size:12px; color:#555;}
  .frow input[type=text], .frow input[type=date], .frow input[type=number], .frow select{
    flex:1; padding:7px 9px; border:1px solid #ccc; border-radius:4px; font-size:14px; width:100%; min-height:36px; min-width:0;}
  .frow2{display:flex; gap:8px;}
  .frow2 .frow{flex:1; min-width:0;}
  /* 375〜430px幅のモバイル縦画面では2カラムが窮屈になるため1カラムに積む（CLAUDE.md 4章） */
  @media (max-width:480px){
    .frow2{flex-direction:column; gap:0;}
  }
  .seg{display:flex; border:1px solid #999; border-radius:5px; overflow:hidden;}
  .seg button{flex:1; padding:8px; border:none; background:#f4f4f0; font-size:13px; font-weight:600; color:#555; white-space:nowrap;}
  .seg button.active{background:#1c2430; color:#fff;}

  /* 明細テーブル（フォーム側） */
  .item-form-table{width:100%; border-collapse:collapse; font-size:12px;}
  .item-form-table th{background:#f4f4f0; padding:5px 4px; font-size:11px; color:#666; text-align:center; border-bottom:1px solid #ddd;}
  .item-form-table td{padding:3px 3px; border-bottom:1px solid #eee;}
  .item-form-table input{width:100%; padding:5px 4px; border:1px solid #ddd; border-radius:3px; font-size:12px;}
  .item-form-table input.num{text-align:right;}
  .item-form-table .sub{text-align:right; font-size:12px; color:#333; padding-right:6px;}
  /* タップ領域はCLAUDE.md 4章の基準（最低44px四方）に合わせmin-heightを優先。横幅は明細テーブルの
     狭い列内という制約上、列の範囲内に留める（第5回修正） */
  .item-form-table .del{background:#f8d8d8; color:#a33; border:none; border-radius:3px; width:32px; min-height:44px; font-size:13px;}
  .add-row-btn{margin-top:8px; padding:7px 14px; border:1px dashed #999; border-radius:5px; background:#fafaf7; font-size:12px; color:#555; width:100%;}
  .items-warning{font-size:11px; color:#a33; margin-top:6px;}

  .action-bar{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;}
  .action-bar button{flex:1 1 45%; min-width:120px; padding:12px; border:none; border-radius:6px; font-size:13px; font-weight:700;}
  .action-bar .save{background:#2A5D8F; color:#fff;}
  .action-bar .clear{background:#f0e0e0; color:#a33;}
  .action-bar .print{background:linear-gradient(135deg,#e7c578,#b8942c); color:#1c2430;}
  .action-bar .share{background:#3a4658; color:#fff;}
  .action-bar button:disabled{opacity:.6; cursor:not-allowed;}

  /* ── 台帳ビュー ── */
  #view-ledger{padding:20px;}
  .ledger-scroll{overflow-x:auto;}
  .ledger-table{width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .ledger-table th{background:#1c2430; color:#fff; padding:9px 10px; font-size:12px; text-align:left;}
  .ledger-table td{padding:9px 10px; font-size:13px; border-bottom:1px solid #eee;}
  .ledger-table tr:last-child td{border-bottom:none;}
  .ledger-table .amt{text-align:right; font-weight:700;}
  /* タップ領域はCLAUDE.md 4章の基準（最低44px四方）に合わせmin-heightを確保。最終列でボタンが
     複数並ぶため、44px化で横に収まらない場合はinline-blockのボタン自体が折り返す（第5回修正） */
  .ledger-actions button{margin-right:4px; margin-bottom:4px; padding:5px 10px; font-size:11px; border:1px solid #ccc; border-radius:4px; background:#fff; min-height:44px;}
  .ledger-actions button.active{background:#1c2430; color:#fff; border-color:#1c2430;}
  .ledger-empty{padding:40px; text-align:center; color:#999; font-size:13px;}
  .ledger-preview-row td{background:#e2e2dd; padding:28px; border-bottom:1px solid #eee;}
  .ledger-preview-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .ledger-preview-actions{display:flex; gap:8px;}
  .ledger-preview-actions button{padding:10px 20px; border:none; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer;}
  .ledger-preview-actions .save{background:#2A5D8F; color:#fff;}
  .ledger-preview-actions .zoom{background:#3a4658; color:#fff;}
  .ledger-preview-actions .print{background:linear-gradient(135deg,#e7c578,#b8942c); color:#1c2430;}
  .ledger-preview-actions .share{background:#5b3a90; color:#fff;}
  .ledger-preview-actions button:disabled{opacity:.6; cursor:not-allowed;}

  /* ── 顧客カルテビュー ── */
  #view-customers.active{display:flex; gap:0; align-items:flex-start;}
  .cust-list-pane{width:360px; min-width:300px; padding:16px; height:calc(100vh - 46px); overflow-y:auto; border-right:1px solid #ddd; background:#f7f7f4;}
  .cust-detail-pane{flex:1; padding:16px; height:calc(100vh - 46px); overflow-y:auto;}
  @media (max-width:900px){
    #view-customers{flex-direction:column;}
    .cust-list-pane, .cust-detail-pane{width:100%; min-width:0; height:auto; border-right:none;}
  }
  .cust-search{width:100%; padding:9px 12px; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-bottom:10px;}
  .cust-item{padding:10px 12px; border-radius:6px; margin-bottom:6px; background:#fff; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .cust-item.selected{background:#1c2430; color:#fff;}
  .cust-item .cn{font-weight:700; font-size:13px;}
  .cust-item .ci{font-size:11px; color:#888;}
  .cust-item.selected .ci{color:#bbb;}
  .cust-veh-tag{display:inline-block; font-size:10px; background:#eee; color:#555; border-radius:10px; padding:2px 8px; margin:4px 4px 0 0; cursor:pointer;}
  .cust-item.selected .cust-veh-tag{background:#3a4658; color:#fff;}
  .cust-veh-tag.soon{background:#f3c563; color:#553; font-weight:700;}

  /* ── 顧客カルテ：車両タブ ── */
  .veh-tabs{display:flex; gap:6px; flex-wrap:wrap; margin:16px 0 10px;}
  .veh-tabs button{padding:8px 14px; border:1px solid #ccc; border-radius:16px; background:#fff; font-size:12px; font-weight:600; color:#555; min-height:36px;}
  .veh-tabs button.active{background:#1c2430; color:#fff; border-color:#1c2430;}
  .veh-tabs button.add-veh-tab{border-style:dashed; color:#2A5D8F; background:#fafaf7;}

  /* ── 宛名サジェスト ── */
  .suggest-box{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #ccc;
    border-radius:0 0 6px 6px; box-shadow:0 6px 16px rgba(0,0,0,.15); z-index:80; max-height:240px; overflow-y:auto; display:none;}
  .suggest-box.open{display:block;}
  .suggest-item{padding:8px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid #f0f0f0;}
  .suggest-item:hover, .suggest-veh:hover{background:#f4f4f0;}
  .suggest-item .si-sub{font-size:11px; color:#888;}
  .suggest-item.new{color:#2A5D8F; font-weight:700;}
  .suggest-veh{padding:8px 12px; font-size:12px; cursor:pointer; border-bottom:1px solid #f0f0f0;}

  /* ── 車検リマインドビュー ── */
  #view-reminder{padding:20px;}
  .reminder-controls{display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
  .reminder-controls .seg{width:auto;}
  .reminder-controls .seg button{padding:8px 16px;}
  .reminder-custom{display:flex; align-items:center; gap:6px; font-size:13px; color:#555;}
  .reminder-custom input{width:70px; padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:13px;}
  .reminder-table{width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .reminder-table th{background:#1c2430; color:#fff; padding:9px 10px; font-size:12px; text-align:left;}
  .reminder-table td{padding:9px 10px; font-size:13px; border-bottom:1px solid #eee; vertical-align:middle;}
  .reminder-table tr:last-child td{border-bottom:none;}
  .reminder-table tr.overdue td{background:#fdecec;}
  .rem-days{font-weight:700;}
  .rem-days.overdue{color:#c33;}
  .rem-days.soon{color:#b8942c;}
  .reminder-actions button{margin-right:4px; margin-bottom:4px; padding:6px 10px; font-size:11px; border:1px solid #ccc; border-radius:4px; background:#fff; min-height:44px;}
  .reminder-actions button:disabled{opacity:.4; cursor:not-allowed;}
  .reminder-empty{padding:40px; text-align:center; color:#999; font-size:13px;}

  /* ── 設定ビュー ── */
  #view-settings{padding:20px; max-width:520px;}

  /* ── A4 帳票（フェーズ0の実証済みスタイルを移植） ── */
  #doc-wrap{background:#fff; box-shadow:0 6px 28px rgba(0,0,0,.28); flex-shrink:0;}
  #doc, .doc-box{position:relative; width:595px; height:842px; background:#fff; box-sizing:border-box;
    padding:11px 23px 8px; font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','MS Mincho',serif;
    color:#111; font-size:9.2px; line-height:1.3;}
  #doc table, .doc-box table{border-collapse:collapse; width:100%;}
  .doc-box{box-shadow:0 6px 28px rgba(0,0,0,.22); margin:0 auto;}
  .hd-row{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px;}
  .hd-left{font-size:9px; line-height:1.6;}
  .hd-title{text-align:center; flex:1;}
  .hd-title .t1{font-size:17.5px; font-weight:700; letter-spacing:.5em; padding-left:.5em;}
  .hd-right table{width:170px; font-size:8.7px;}
  .hd-right td{border:1px solid #111; padding:1px 4px;}
  .hd-right td.lbl{background:#f2f2ee; width:58px; color:#333; white-space:nowrap;}
  .hd-right td.val-kubun{font-size:7.4px;}
  /* 「初度」列を見出し行と同系色の背景で塗り分ける（第2回修正） */
  .veh-table td.shodo-hl{background:#f2f2ee;}
  .parties{display:flex; justify-content:space-between; margin:3px 0 5px; gap:14px;}
  .p-col{width:48%; font-size:8.7px; line-height:1.4;}
  .p-col .name{font-size:11.5px; font-weight:700; border-bottom:1.4px solid #111; padding-bottom:2px; margin:1px 0 2px; display:inline-block;}
  .p-col .person{font-size:8.3px; color:#333;}
  .p-col .code{font-size:8.5px; color:#333; margin-top:2px;}
  .p-col.right{text-align:left;}
  .p-col.right .kikan{font-size:7.8px; color:#555;}
  .p-col.right .shopname{font-size:11.5px; font-weight:700; margin:1px 0;}
  .ph{color:#b23; font-size:7.8px;}
  .veh-table{margin-bottom:3px; font-size:8.5px;}
  .veh-table td{border:1px solid #111; padding:1.5px 4px;}
  .veh-table tr:first-child td{background:#f2f2ee; color:#333; font-size:8px; text-align:center;}
  .items-table{margin-bottom:1.5px; font-size:8.5px; table-layout:fixed;}
  .items-table.dense{font-size:7.4px;}
  .items-table col.c-name{width:auto;}
  .items-table col.c-num{width:58px;}
  .items-table th{border:1px solid #111; background:#e8e8e2; padding:2px 3px; font-weight:700; text-align:center;}
  .items-table td{border:1px solid #111; padding:1px 4px; height:auto;}
  .items-table.dense td{padding:0.3px 3px;}
  .items-table td.num{text-align:right;}
  .foot-row{display:flex; justify-content:space-between; gap:12px; margin-top:1px;}
  .foot-l{width:56%; font-size:8.7px;}
  .foot-r{width:42%; font-size:8.7px;}
  .cost-table td{border:1px solid #111; padding:1px 5px;}
  .cost-table td.lbl{background:#f8f8f6; color:#444;}
  .cost-table td.val{text-align:right; width:72px;}
  .small-sum td{border:1px solid #111; padding:1px 5px; font-size:8.3px;}
  .small-sum td.lbl{background:#f8f8f6; color:#555;}
  .small-sum td.val{text-align:right; width:72px;}
  .next-box{font-size:8.3px; margin-top:2px; line-height:1.25;}
  .thanks{font-size:7.5px; color:#333; line-height:1.2; margin-top:2px;}
  .bank{font-size:7.5px; color:#333; line-height:1.15; margin-top:1px; border-top:1px solid #ddd; padding-top:1px;}
  .r-table{margin-bottom:4px;}
  .r-table td{border:1px solid #111; padding:1.5px 5px;}
  .r-table td.lbl{background:#f8f8f6; color:#444; width:60px;}
  .r-table td.val{text-align:right; width:72px;}
  .req-box{border:2px solid #111; border-radius:6px; padding:3px 8px; margin-top:2px; text-align:center;}
  .req-box .rl{font-size:10px; font-weight:700;}
  .req-box .rsub{font-size:8px; color:#666;}
  .req-box .rv{font-size:15.5px; font-weight:700; margin-top:2px;}

  /* ── プレビュー拡大オーバーレイ ── */
  .btn-zoom{margin-bottom:12px; padding:8px 16px; border:none; border-radius:6px; font-size:13px; font-weight:700;
    background:#3a4658; color:#fff; align-self:center;}
  #doc-wrap{cursor:zoom-in;}
  #doc-zoom{display:none; position:fixed; top:0; right:0; bottom:0; left:0; z-index:300; background:rgba(20,24,32,.82);}
  #doc-zoom.open{display:block;}
  #doc-zoom .dz-bar{position:absolute; top:0; right:0; left:0; height:48px; display:flex; align-items:center;
    justify-content:flex-end; gap:8px; padding:0 14px; z-index:2; background:rgba(28,36,48,.6);}
  #doc-zoom .dz-bar button{padding:7px 14px; border:none; border-radius:6px; font-size:15px; font-weight:700;
    background:#3a4658; color:#fff; min-width:40px;}
  #doc-zoom .dz-bar button.dz-close{background:linear-gradient(135deg,#e7c578,#b8942c); color:#1c2430;}
  #doc-zoom .dz-level{color:#fff; font-size:13px; min-width:52px; text-align:center;}
  #doc-zoom .dz-scroll{position:absolute; top:48px; right:0; bottom:0; left:0; overflow:auto; padding:20px;
    display:flex; justify-content:center; align-items:flex-start;}
  #doc-zoom .dz-stage{position:relative; margin:0 auto; flex-shrink:0;}
  #doc-zoom #dz-doc{position:absolute; top:0; left:0; margin:0; transform-origin:top left;
    box-shadow:0 10px 40px rgba(0,0,0,.5);}

  @media print{
    body>*{display:none !important;}
    #doc-zoom{display:none !important;}
    #print-area{display:block !important; position:static !important; background:#fff !important;}
    #print-area > div{
      transform:scale(1.3333) !important;
      transform-origin:top left !important;
      width:595px; height:842px;
      overflow:hidden;
      page-break-after:avoid; break-after:avoid;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    @page{size:A4; margin:0;}
  }
  #print-area{display:none;}

  /* 数値入力欄のスピナー（上下ボタン）はデフォルトで非表示にする。数量欄（.qty-num）のみ下で復活させる */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }
  input[type=number].qty-num{ -moz-appearance:number-input; }
  input[type=number].qty-num::-webkit-outer-spin-button,
  input[type=number].qty-num::-webkit-inner-spin-button{ -webkit-appearance:auto; }
</style>
</head>
<body>

<div class="topnav">
  <h1>ケンズオート 請求書アプリ</h1>
  <div class="tabs" id="main-tabs">
    <button data-view="create" class="active">請求書作成</button>
    <button data-view="ledger">台帳</button>
    <button data-view="customers">顧客カルテ</button>
    <button data-view="reminder">車検リマインド</button>
    <button data-view="settings">⚙設定</button>
  </div>
  <div class="spacer"></div>
  <button class="btn-ghost" id="btn-new">＋ 新規作成</button>
</div>
<div class="toast" id="toast"></div>

<!-- ============ 請求書作成 ============ -->
<div class="view active" id="view-create">
  <div class="form-pane" id="form-pane"></div>
  <div class="preview-pane">
    <button class="btn-zoom" id="btn-zoom-doc">🔍 拡大表示</button>
    <div id="doc-wrap"><div id="doc"></div></div>
  </div>
</div>

<!-- ============ 台帳 ============ -->
<div class="view" id="view-ledger">
  <div id="ledger-body"></div>
</div>

<!-- ============ 顧客カルテ ============ -->
<div class="view" id="view-customers">
  <div class="cust-list-pane" id="cust-list-pane"></div>
  <div class="cust-detail-pane" id="cust-detail-pane"></div>
</div>

<!-- ============ 車検リマインド ============ -->
<div class="view" id="view-reminder">
  <div id="reminder-body"></div>
</div>

<!-- ============ 設定 ============ -->
<div class="view" id="view-settings">
  <div id="settings-body"></div>
</div>

<div id="print-area"></div>

<!-- ============ プレビュー拡大オーバーレイ ============ -->
<div id="doc-zoom">
  <div class="dz-bar">
    <button onclick="dzZoom(-0.25)" aria-label="縮小">−</button>
    <span id="dz-level" class="dz-level">100%</span>
    <button onclick="dzZoom(0.25)" aria-label="拡大">＋</button>
    <button class="dz-close" onclick="closeDocZoom()">✕ 閉じる</button>
  </div>
  <div class="dz-scroll" id="dz-scroll" onclick="if(event.target===this) closeDocZoom()">

function getTodayISO(){

  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;

function parseReiwaParts(iso){
  if(!iso) return null;
  const [y,m,dd] = iso.split('-').map(Number);
  /* "R7.7.8" 等の旧仕様自由入力文字列はハイフン区切りでないためNaNになる。
     NaN<1 は false 判定になり素通りしてしまうため、有限数チェックを明示する */
  if(!Number.isFinite(y) || !Number.isFinite(m) || !Number.isFinite(dd)) return null;
  const ry = y - 2018;
  if(ry < 1) return null;
  return {ry, m, dd};
}

/* 保存データが存在するのにJSON.parseやnormalize*Data()が失敗した場合（＝データ破損）にのみ呼ぶ。

function notifyDataCorruption(label){

/* ============================================================

   ============================================================ */
const STORAGE_OK = (function(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; }
})();
let memStore = {};
function getStoreItem(key){
  if(STORAGE_OK) return localStorage.getItem(key);
  return memStore[key] || null;
}
/* 容量超過（QuotaExceededError等）でlocalStorage.setItemが失敗した場合、以前は無反応で
   ユーザーに保存失敗が伝わらなかった。try-catchで保護し成否をbooleanで返すよう変更し、
   呼び出し元のsave*ToStorage()経由で保存失敗を検知できるようにする（中優先度修正） */
function setStoreItem(key, val){
  try{
    if(STORAGE_OK) localStorage.setItem(key, val);
    else memStore[key] = val;
  }catch(e){
    showToast('保存に失敗しました。デバイスの空き容量が不足している可能性があります。バックアップを書き出してから、古いデータの整理をご検討ください');
    return false;
  }
  checkStorageCapacityWarning();
  return true;
}
/* CLAUDE.md 7章：iOS Safari等のlocalStorage容量制限（目安5MB）を見越し、上限に近づいたら警告する。
   保存のたびに毎回警告するとユーザーの妨げになるため、1セッション（ページ読み込みから次のリロードまで）
   につき1回のみ表示する */
let capacityWarningShown = false;
const STORAGE_CAPACITY_WARNING_BYTES = 5 * 1024 * 1024 * 0.8; // 5MBの80%（4MB）
function estimateStorageUsageBytes(){
  let total = 0;
  if(!STORAGE_OK) return total;
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key && key.indexOf('ken_')===0){
      total += new Blob([localStorage.getItem(key)||'']).size;
    }
  }
  return total;
}
function checkStorageCapacityWarning(){
  if(capacityWarningShown) return;
  if(estimateStorageUsageBytes() > STORAGE_CAPACITY_WARNING_BYTES){
    capacityWarningShown = true;
    showToast('保存データの容量が上限に近づいています。バックアップを書き出してから、古い請求書データの整理をご検討ください');
  }
}

const TOTALS_KEY_MIGRATION = {
  gijutsuryou:'laborCost', buhindai:'partsCost', nebiki:'discount', shohizei:'consumptionTax',
  goukei2:'laborPartsTotal', shohi1:'miscCostTotal', sangaku:'adjustmentAmount', uriage:'sales',
  seikyu:'billingAmount', kazei10:'taxableAmount', kazei10zei:'taxAmount', kazeigai:'taxExemptTotal',
};
function migrateTotalsKeys(totals){
  const migrated = {};
  Object.keys(totals).forEach(key=>{
    migrated[TOTALS_KEY_MIGRATION[key] || key] = totals[key];
  });
  return migrated;
}
function normalizeLedgerData(list){
  if(list===undefined || list===null) list = [];
  if(!Array.isArray(list)) throw new Error('台帳データの形式が不正です');

    /* 旧キー名（gijutsuryou等）で保存されたtotalsスナップショットを新キー名に移行する */
    if(r.totals && r.totals.seikyu!==undefined && r.totals.billingAmount===undefined){
      r.totals = migrateTotalsKeys(r.totals);
    }
    /* 振込先の単一選択（bankAccountId、第2回修正）を複数選択（bankAccountIds、第9回修正）へ移行する */
    if(!r.bankAccountIds && r.bankAccountId){
      r.bankAccountIds = [r.bankAccountId];
    }
  });
  return list;
}

   敬称の初期値は「様」、既にcompanyNameを持っていた＝会社客は「御中」とし、現状の見た目を変えない */
function normalizeCustomersData(list){
  if(list===undefined || list===null) list = [];

  list.forEach(c=>{

}

function generateId(prefix, arr){
  let max = 0;
  arr.forEach(x=>{
    const m = /^\D*(\d+)$/.exec(x.id||'');
    if(m){ const n=parseInt(m[1],10); if(n>max) max=n; }
  });
  return prefix + (max+1);
}
function toHiragana(s){
  return String(s||'').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
/* かな欄はカタカナで統一表示する（ひらがな入力を自動変換） */
function toKatakana(s){
  return String(s||'').replace(/[ぁ-ん]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
/* 郵便番号：数字以外を除去し3-4桁で自動整形 */
function formatPostal(raw){
  const d = String(raw||'').replace(/[^0-9]/g,'').slice(0,7);
  if(d.length<=3) return d;
  return d.slice(0,3)+'-'+d.slice(3);
}
/* 電話番号・FAX：市外局番の桁数に関わらず3-4-4で統一して自動整形 */
function formatPhone(raw){
  const d = String(raw||'').replace(/[^0-9]/g,'').slice(0,11);
  const a = 3;
  if(d.length<=a) return d;
  if(d.length<=a+4) return d.slice(0,a)+'-'+d.slice(a);
  return d.slice(0,a)+'-'+d.slice(a,a+4)+'-'+d.slice(a+4);
}
/* 整形関数(formatPostal/formatPhone等)適用後、input.valueへの代入でカーソルが末尾に飛ばないよう、
   カーソル位置を復元する。整形前後の「文字数の差分」だけで位置を計算すると、桁数上限による末尾の
   数字の切り捨てとハイフン位置の移動が重なった際に計算がずれ、入力中の欄の途中で数字を挿入すると
   カーソルが誤った位置に移動して以降の入力が乱れる不具合があった（第3回修正）。
   カーソルより前にある「数字の個数」を数え、整形後の文字列でも同じ個数の数字の直後にカーソルを置く
   ことで、ハイフン位置や桁の切り捨てが起きても正しい位置に復元する */
function setFormattedValueKeepCursor(el, formatter){
  const oldPos = el.selectionStart;
  const digitsBeforeCursor = el.value.slice(0, oldPos).replace(/[^0-9]/g,'').length;
  const formatted = formatter(el.value);
  el.value = formatted;
  let newPos = formatted.length;
  if(digitsBeforeCursor === 0){
    newPos = 0;
  } else {
    let seen = 0;
    for(let i=0;i<formatted.length;i++){
      if(/[0-9]/.test(formatted[i])){
        seen++;
        if(seen===digitsBeforeCursor){ newPos = i+1; break; }
      }
    }
  }
  el.setSelectionRange(newPos, newPos);
  return formatted;
}
/* お客様コード：既存の5桁数値コードの最大値+1を5桁ゼロ埋めで返す */
function getNextCustomerCode(){
  let max = Number(shop.customerSeq)||0;
  customers.forEach(c=>{
    if(c.code && /^\d{5}$/.test(c.code)){ const n=parseInt(c.code,10); if(n>max) max=n; }
  });
  return String(max+1).padStart(5,'0');
}
/* お客様コードを実際に払い出す（新規顧客に割り当てる）タイミングでのみ呼ぶ。高水位マークを進めて
   永続化することで、顧客削除後にコードが再利用されないようにする（第5回修正） */
function issueCustomerCode(){
  const code = getNextCustomerCode();
  const n = parseInt(code,10);
  if(!isNaN(n) && n > (Number(shop.customerSeq)||0)){ shop.customerSeq = n; saveShop(); }
  return code;

/* 台帳・顧客一覧・サジェストで共通して使う宛名表示ルール：会社名があれば会社名（個人名）主表示、無ければ個人名のみ */
function getCustomerDisplayName(cust){
  if(!cust) return '';
  /* nameは第8回修正で廃止した旧・宛名（担当者名）欄の名残。移行処理でcompanyNameへコピーした
     個人客はname===companyNameになるため、二重表示（例：「山田太郎（山田太郎）」）を防ぐため
     一致する場合は括弧書きを付けない。companyNameと異なる場合（旧仕様の会社customer+担当者名）のみ
     従来通り括弧書きで併記する */
  if(cust.companyName) return cust.companyName + (cust.name && cust.name!==cust.companyName ? `（${cust.name}）` : '');
  return cust.name || '';
}
function searchCustomers(query){
  const q = String(query||'').trim();
  if(!q) return customers;
  const qh = toHiragana(q);
  return customers.filter(c=>{
    if(c.companyName && toHiragana(c.companyName).indexOf(qh)===0) return true;
    /* 会社名かな（companyKana）も検索対象に含める。以前は会社名かなだけ検索から漏れていた（第8回修正） */
    if(c.companyKana && toHiragana(c.companyKana).indexOf(qh)===0) return true;
    if(c.code && c.code.indexOf(q)===0) return true;
    if(c.tel && c.tel.includes(q)) return true;
    return vehicles.some(v=>v.customerId===c.id && (
      (v.regNo && v.regNo.includes(q)) ||
      (v.chassisNo && v.chassisNo.includes(q)) ||
      (v.shikiShitei && v.shikiShitei.includes(q)) ||
      (v.ruibetsu && v.ruibetsu.includes(q))
    ));
  });
}

/* 請求書保存時に顧客・車両カルテへ反映（アップサート）。空欄の項目は既存値を上書きしない。 */
function upsertCustomerAndVehicle(cust, veh){
  if(!cust || (!cust.companyName && !cust.code && !cust.tel)) return null;
  let c = null;
  let isNewCustomer = false;
  if(cust.code){
    const byCode = customers.find(x=>x.code && x.code===cust.code);
    if(byCode){
      /* お客様コードが一致しても、双方に名称が入力されていて食い違う場合は別人の可能性があるため、
         無条件で上書きせず確認を取ってから統合する（第3回修正） */
      const nameConflict = cust.companyName && byCode.companyName && cust.companyName!==byCode.companyName;
      if(!nameConflict || confirm('お客様コード '+cust.code+' は「'+byCode.companyName+'」として既に登録されています。\n入力された名称「'+cust.companyName+'」と一致しませんが、同一人物として上書きしますか？\n（いいえの場合は別の新しいお客様として登録します）')){
        c = byCode;
      }
    }
  }
  /* 会社名（個人名）＋電話番号が一致する既存顧客を同一人物とみなす。ただし双方とも電話番号未入力（空文字同士）だと
     同姓同名の別人を誤って統合してしまうため、電話番号が入力されている場合のみマッチさせる（第3回修正）。
     第8回修正：宛名（担当者名）欄の廃止により個人客も会社名（個人名）欄のみを持つため、コード一致に加えて
     こちらもcompanyName基準に統一（従来は個人名＋電話番号のみでマッチしており、会社名のみの顧客は
     マッチ手段がなく毎回重複登録されていた） */
  if(!c && cust.companyName){
    c = customers.find(x=>x.companyName===cust.companyName && cust.tel && x.tel===cust.tel);
  }
  if(!c){
    c = { id: generateId('c', customers), companyName:'', companyKana:'', honorific:'御中', tel:'', postal:'', address:'', code:'', email:'' };
    customers.push(c);
    isNewCustomer = true;
  }
  ['companyName','companyKana','honorific','tel','postal','address','code','email'].forEach(k=>{ if(cust[k]) c[k]=cust[k]; });
  if(isNewCustomer && !c.code) c.code = issueCustomerCode();
  /* お客様コードが他の顧客と重複してしまう場合（コード衝突を確認のうえ別人として新規登録した場合等）は
     自動採番し直し、コードの一意性を保つ（第3回修正） */
  if(c.code && customers.some(x=>x!==c && x.code===c.code)) c.code = issueCustomerCode();

  if(veh && veh.regNo){
    let v = vehicles.find(x=>x.customerId===c.id && x.regNo===veh.regNo);
    if(!v){
      v = { id: generateId('v', vehicles), customerId: c.id, regNo:'', carName:'', modelType:'', engine:'', chassisNo:'',
        shodo:'', regDate:'', shikiShitei:'', ruibetsu:'', mileage:'', nextShaken:'', nextTenken:'' };
      vehicles.push(v);
    }
    ['regNo','carName','modelType','engine','chassisNo','shodo','regDate','shikiShitei','ruibetsu','mileage','nextShaken','nextTenken'].forEach(k=>{
      if(veh[k]) v[k]=veh[k];
    });
  }
  saveCustomersToStorage();
  saveVehiclesToStorage();
  return c.id;
}
function isShakenSoon(iso){
  if(!iso) return false;
  const diffDays = (new Date(iso) - new Date(getTodayISO())) / 86400000;
  return diffDays >= 0 && diffDays <= 60;
}

function fillTemplate(tpl, c, v){
  c = c || {}; v = v || {};
  /* c.nameだけを参照すると、宛名（担当者名）が未入力の会社名のみの顧客で{顧客名}タグが空欄になって
     しまう不具合があった。台帳等の宛名表示と同じgetCustomerDisplayName()（会社名優先・個人名は
     括弧書きで併記）に統一して解消（第8回修正） */
  return String(tpl||'')
    .replace(/\{顧客名\}/g, getCustomerDisplayName(c)||'')
    .replace(/\{車両\}/g, v.carName||'')
    .replace(/\{ナンバー\}/g, v.regNo||'')
    .replace(/\{次回車検日\}/g, toWarekiShort(v.nextShaken)||'未設定');
}
function buildReminderMessage(c, v){
  return fillTemplate(templates.shakenReminder, c, v);
}
/* nextShaken が「今日〜今日＋days日」の車両を対象に、超過→間近→先の順（残日数昇順）で抽出 */
function getReminderTargets(days){
  const todayMs = new Date(getTodayISO()).getTime();
  const list = [];
  vehicles.forEach(v=>{
    if(!v.nextShaken) return;
    const diffDays = Math.round((new Date(v.nextShaken).getTime() - todayMs) / 86400000);
    if(diffDays <= days){
      list.push({ v, c: customers.find(x=>x.id===v.customerId) || null, diffDays });
    }
  });
  list.sort((a,b)=>a.diffDays-b.diffDays);
  return list;
}
function copyToClipboard(text, msg){
  const done = ()=>showToast(msg||'コピーしました');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0'; ta.style.right='0'; ta.style.bottom='auto';
  ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}
function findReminderPair(vehId){
  const v = vehicles.find(x=>x.id===vehId);
  if(!v) return null;
  return { v, c: customers.find(x=>x.id===v.customerId) || null };
}

}

/* ============================================================
   計算（フェーズ0の検算ロジックを共通関数化）
   ============================================================ */
function computeTotals(s){
  const c = s.costs;
  /* 諸費用の無地行（extra1〜3）：課税指定があれば10%課税対象額に、いずれにせよ①諸費用合計には含める */
  const extras = [c.extra1, c.extra2, c.extra3].map(e=>e||{amount:0,taxable:false});
  const extraTaxable = extras.reduce((sum,e)=>sum+(e.taxable?(Number(e.amount)||0):0),0);
  const extraAll = extras.reduce((sum,e)=>sum+(Number(e.amount)||0),0);
  /* 用語集（CLAUDE.md 12章）の英語表記に合わせて変数名を整理（第5回修正）。
     laborCost=技術料、partsCost=部品代、discount=技術料値引、consumptionTax=10%消費税、
     laborPartsTotal=②上記合計、miscCostTotal=①諸費用合計、adjustmentAmount=③自由項目の金額、
     sales=売上合計、billingAmount=請求額、taxableAmount/taxAmount=10%課税対象額・消費税、
     taxExemptTotal=課税対象外計。用語集にない内部専用の名称は自然な英語で新規に付けた */
  const laborCost = s.items.reduce((sum,r)=>sum+(Number(r.tech)||0),0);
  const partsCost = s.items.reduce((sum,r)=>sum+(Number(r.qty)||0)*(Number(r.price)||0),0);
  const discount = Number(s.nebiki)||0;
  const taxableBase = laborCost+discount+partsCost+(Number(c.tester)||0)+(Number(c.jimu)||0)+extraTaxable;
  const consumptionTax = Math.round(taxableBase*0.1);
  const laborPartsTotal = laborCost+discount+partsCost+consumptionTax;
  const miscCostTotal = (Number(c.jibaiseki)||0)+(Number(c.jyuryozei)||0)+(Number(c.inshi)||0)+(Number(c.gijutsu)||0)+(Number(c.tester)||0)+(Number(c.jimu)||0)+(Number(c.daikou)||0)+extraAll;
  /* state.sangakuは旧仕様（数値のみ）と新仕様（{label,amount}）の両方があり得るため両対応する */
  const sangakuRaw = s.sangaku;
  const adjustmentAmount = Number(sangakuRaw && typeof sangakuRaw==='object' ? sangakuRaw.amount : sangakuRaw) || 0;
  const sales = miscCostTotal+laborPartsTotal-adjustmentAmount;
  const billingAmount = sales;
  const taxableAmount = taxableBase;
  const taxAmount = consumptionTax;
  const taxExemptTotal = sales-taxableAmount-taxAmount;
  return { laborCost, partsCost, discount, consumptionTax, laborPartsTotal, miscCostTotal, adjustmentAmount, sales, billingAmount, taxableAmount, taxAmount, taxExemptTotal };
}

function renderItemFormTable(){
  const tbl = document.getElementById('item-form-table');
  let html = `<tr><th style="width:38%">品目</th><th>技術料</th><th>数量</th><th>部品単価</th><th>部品小計</th><th></th></tr>`;
  state.items.forEach((r,i)=>{
    const sub = (Number(r.qty)||0)*(Number(r.price)||0);
    html += `<tr>
      <td><input type="text" value="${escapeHtml(r.name)}" oninput="onItemInput(${i},'name',this.value)"></td>
      <td><input type="number" class="num" value="${escapeHtml(r.tech||'')}" oninput="onItemInput(${i},'tech',this.value)"></td>
      <td><input type="number" class="num qty-num" value="${escapeHtml(r.qty||'')}" oninput="onItemInput(${i},'qty',this.value)"></td>
      <td><input type="number" class="num" value="${escapeHtml(r.price||'')}" oninput="onItemInput(${i},'price',this.value)"></td>
      <td class="sub" id="item-sub-${i}">${sub?formatYen(sub):''}</td>
      <td><button class="del" onclick="deleteItemRow(${i})">✕</button></td>
    </tr>`;
  });
  tbl.innerHTML = html;
}
/* 明細が「種別選択時の定型そのまま」＝未編集かどうか。未編集ならトグル時に安全に入れ替えられる。 */
let itemsTouched = false;

function onItemInput(i, key, val){
  itemsTouched = true;
  if(key==='name') state.items[i].name = val;
  else state.items[i][key] = Number(val)||0;
  if(key!=='name'){
    const sub = (Number(state.items[i].qty)||0)*(Number(state.items[i].price)||0);
    const el = document.getElementById('item-sub-'+i);
    if(el) el.textContent = sub?formatYen(sub):'';
  }
  renderPreview();
}
function addItemRow(){
  itemsTouched = true;
  state.items.push({name:'', tech:0, qty:0, price:0});
  renderItemFormTable();
  renderPreview();
}
function deleteItemRow(i){
  itemsTouched = true;
  state.items.splice(i,1);
  renderItemFormTable();
  renderPreview();
}

/* ============================================================
   顧客カルテ・サジェスト（請求書作成画面の会社名（個人名）入力）
   ============================================================ */
/* 会社名（個人名）欄からカルテ検索候補を出す（第8回修正：宛名（担当者名）欄の廃止に伴い、
   サジェストは会社名（個人名）欄のみに一本化） */
function wireCompanySuggest(){
  const input = document.getElementById('f-cust-company-name');
  const box = document.getElementById('cust-company-suggest');
  if(!input || !box) return;
  input.addEventListener('input', function(){ showCustSuggest(this.value, box); });
  input.addEventListener('focus', function(){ showCustSuggest(this.value, box); });
  wireSuggestBoxActions(box);
}
/* サジェストボックス内の候補クリックをイベント委譲で処理する。
   検索文字列（自由入力）をonclick文字列に組み立てるとJS文字列リテラルを脱出されXSSの原因になるため、
   data-*属性に値を格納しdatasetから読み取る（wireStaffSuggest()と同じ安全なパターン。第3回修正） */
function wireSuggestBoxActions(box){
  box.addEventListener('click', function(e){
    const item = e.target.closest('[data-action]');
    if(!item) return;
    const action = item.dataset.action;
    if(action==='pick-customer') pickCustomer(item.dataset.id);
    else if(action==='pick-vehicle') pickVehicle(item.dataset.id);
    else if(action==='register-new') registerNewCustomerInline(item.dataset.query);
  });
}
function showCustSuggest(query, box){
  const q = String(query||'').trim();
  if(!q){ box.classList.remove('open'); box.innerHTML=''; return; }
  const matches = searchCustomers(q).slice(0,6);
  let html = matches.map(c=>{
    const vehs = vehicles.filter(v=>v.customerId===c.id);
    const vehLabel = vehs.length ? vehs.map(v=>v.regNo).filter(Boolean).join('・') : '車両未登録';
    const primary = getCustomerDisplayName(c) || '（会社名未登録）';
    return `<div class="suggest-item" data-action="pick-customer" data-id="${escapeHtml(c.id)}">
      <div>${escapeHtml(primary)}</div>
      <div class="si-sub">${escapeHtml(c.companyKana||'')} ${escapeHtml(c.tel||'')} ${escapeHtml(vehLabel)}</div>
    </div>`;
  }).join('');
  html += `<div class="suggest-item new" data-action="register-new" data-query="${escapeHtml(q)}">＋「${escapeHtml(q)}」を新規登録</div>`;
  box.innerHTML = html;
  box.classList.add('open');
}
function applyVehicleToState(v){
  state.vehicle = { regNo:v.regNo, carName:v.carName, modelType:v.modelType, engine:v.engine, chassisNo:v.chassisNo,
    shodo:v.shodo, regDate:v.regDate, shikiShitei:v.shikiShitei, ruibetsu:v.ruibetsu, mileage:v.mileage,
    nextShaken:v.nextShaken, nextTenken:v.nextTenken };
}
function pickCustomer(custId){
  const c = customers.find(x=>x.id===custId);
  if(!c) return;
  state.customer = { companyName:c.companyName||'', companyKana:c.companyKana||'', honorific:c.honorific||'御中', postal:c.postal||'', address:c.address||'', code:c.code||'', tel:c.tel||'', email:c.email||'' };
  const vehs = vehicles.filter(v=>v.customerId===custId);
  document.getElementById('cust-company-suggest').classList.remove('open');
  if(vehs.length===1){
    applyVehicleToState(vehs[0]);
    renderCreateView();
    showToast(getCustomerDisplayName(c)+'を選択しました');
  } else if(vehs.length>1){
    /* 車両が複数あり選択待ちになる間、前の顧客の車両情報が残ったまま保存されないよう一旦空にする（第3回修正） */
    state.vehicle = createEmptyVehicle();
    renderCreateView();
    showVehiclePicker(vehs);
  } else {
    /* 車両未登録の顧客に切り替えた場合も、前の顧客の車両情報が残らないよう空にする（第3回修正） */
    state.vehicle = createEmptyVehicle();
    renderCreateView();
    showToast(getCustomerDisplayName(c)+'を選択しました（車両未登録）');
  }
}
function showVehiclePicker(vehs){
  const box = document.getElementById('cust-company-suggest');
  if(!box) return;
  box.innerHTML = '<div class="suggest-item" style="font-weight:700;color:#666;cursor:default;">車両を選択してください</div>' +
    vehs.map(v=>`<div class="suggest-veh" data-action="pick-vehicle" data-id="${escapeHtml(v.id)}">${escapeHtml(v.regNo)||'(ナンバー未登録)'}　${escapeHtml(v.carName)}</div>`).join('');
  box.classList.add('open');
}
function pickVehicle(vehId){
  const v = vehicles.find(x=>x.id===vehId);
  if(!v) return;
  applyVehicleToState(v);
  renderCreateView();
  const box = document.getElementById('cust-company-suggest');
  if(box) box.classList.remove('open');
  showToast('車両を選択しました（'+(v.regNo||'')+'）');
}
/* 会社名（個人名）欄からの新規登録。同じ請求書内で続けて新規登録した場合、既に採番済みの同一顧客
   （state.customer.code）に追記する形にし、別人として二重登録してしまわないようにする
   （第3回修正・第6回修正）。第8回修正：宛名（担当者名）欄の廃止に伴い、会社名（個人名）欄のみを
   対象にするよう簡略化 */
function registerNewCustomerInline(name){
  if(!name) return;
  const already = state.customer.code && customers.find(x=>x.code===state.customer.code);
  let c;
  if(already){
    c = already;
    c.companyName = name;
  } else {
    const code = issueCustomerCode();
    c = { id: generateId('c', customers),
      companyName: name, companyKana: state.customer.companyKana||'',
      honorific: state.customer.honorific||'御中',
      tel: state.customer.tel||'', postal: state.customer.postal||'', address: state.customer.address||'',
      code, email: state.customer.email||'' };
    customers.push(c);
  }
  saveCustomersToStorage();
  state.customer = { companyName:c.companyName, companyKana:c.companyKana||'', honorific:c.honorific||'御中', postal:c.postal||'', address:c.address||'', code:c.code, tel:c.tel||'', email:c.email||'' };
  /* 新規登録した顧客はまだ車両を持たないため、前の顧客の車両情報が残らないよう空にする（第3回修正） */
  state.vehicle = createEmptyVehicle();
  renderCreateView();
  showToast('「'+name+'」を新規登録しました');
}

function wireSimpleInput(id, getSetPath){
  const el = document.getElementById(id);
  if(!el) return;
  const handler = function(){
    setDeep(state, getSetPath, this.value);
    renderPreview();
  };
  el.addEventListener('input', handler);
  if(el.tagName==='SELECT') el.addEventListener('change', handler); // 一部環境でselectのinputイベントが発火しないため併用
}
function setDeep(obj, path, val){
  const parts = path.split('.');
  let o = obj;
  for(let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}

/* 振込先チェックボックス群の結線。チェックした口座のidだけをstate.bankAccountIdsに保持する（第9回修正） */
function wireBankAccountChecks(){
  const wrap = document.getElementById('f-bank-account-checks');
  if(!wrap) return;
  wrap.addEventListener('change', function(e){
    const cb = e.target.closest('input[type=checkbox][data-bank-id]');
    if(!cb) return;
    const id = cb.dataset.bankId;
    state.bankAccountIds = state.bankAccountIds || [];
    if(cb.checked){
      if(!state.bankAccountIds.includes(id)) state.bankAccountIds.push(id);
    } else {
      state.bankAccountIds = state.bankAccountIds.filter(x=>x!==id);
    }
    renderPreview();
  });
}
/* かな欄・郵便番号/電話番号欄など「入力の都度、値を自動整形して反映する」欄の共通結線ロジック。
   IME変換確定前（isComposing中）に値を上書きすると変換状態が壊れる（かな欄ならひらがなが残る、
   郵便番号・電話番号欄ならiPad等のIME変換候補バー表示中の合成文字列と既存値が混ざり桁が重複・
   欠落する）ため、変換確定後（compositionend）にのみformatterを適用する。
   この結線ロジックはwireKanaInput()とwireCustomerDetail()内2箇所（かな欄）、および
   wireFormatInput()・顧客カルテのcd-postal/cd-tel・bindFormatted()（郵便番号・電話番号欄、計7箇所）
   で重複していたため、wireFormattedField()として共通化した（第5回修正でかな欄のみ共通化、
   第10回修正で郵便番号・電話番号欄にも横展開） */
function wireFormattedField(el, formatter, onApply){
  if(!el) return;
  let composing = false;
  const apply = function(){
    const formatted = setFormattedValueKeepCursor(el, formatter);
    onApply(formatted);
  };
  el.addEventListener('compositionstart', function(){ composing = true; });
  el.addEventListener('compositionend', function(){ composing = false; apply(); });
  el.addEventListener('input', function(e){ if(e.isComposing || composing) return; apply(); });
}
/* 郵便番号・電話番号：入力の都度ハイフンを自動整形して反映する */
function wireFormatInput(id, path, formatter){

    renderPreview();
  });
}

/* 受付担当者・整備担当者：設定シート登録済みリストからの入力候補（サジェスト） */
function wireStaffSuggest(inputId, boxId, listGetter, statePath){
  const input = document.getElementById(inputId);
  const box = document.getElementById(boxId);
  if(!input || !box) return;
  const show = ()=>{
    const list = listGetter();
    const q = input.value.trim();
    const matches = (q ? list.filter(n=>n.indexOf(q)===0) : list).slice(0,8);
    if(matches.length===0){ box.classList.remove('open'); box.innerHTML=''; return; }
    box.innerHTML = matches.map(n=>`<div class="suggest-item" data-name="${escapeHtml(n)}">${escapeHtml(n)}</div>`).join('');
    box.classList.add('open');
  };
  input.addEventListener('input', show);
  input.addEventListener('focus', show);
  box.addEventListener('click', function(e){
    const item = e.target.closest('.suggest-item');
    if(!item) return;
    input.value = item.dataset.name;
    setDeep(state, statePath, item.dataset.name);
    box.classList.remove('open');
    renderPreview();
  });
}

/* ============================================================
   請求書PDFの共有（Web Share API・html2canvas + jsPDF）
   ============================================================ */
/* 帳票要素（#doc または .doc-box）をA4のPDF Blobに変換する */
async function generateInvoicePDFBlob(sourceEl){
  const canvas = await html2canvas(sourceEl, {scale:2, backgroundColor:'#ffffff'});
  const imgData = canvas.toDataURL('image/jpeg', 0.92); // JPEGで容量を抑え、モバイル回線での共有に配慮
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  pdf.addImage(imgData, 'JPEG', 0, 0, pw, ph);
  return pdf.output('blob');
}
/* rec: 請求書データ（state または台帳レコード）／sourceEl: キャンバス化対象のDOM要素／btnEl: 押されたボタン（ローディング表示用、省略可） */
async function shareInvoicePDF(rec, sourceEl, btnEl){
  if(!sourceEl){ showToast('共有対象の帳票が見つかりませんでした'); return; }
  const invNo = (rec && rec.invNo) || '未採番';
  const origLabel = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = '作成中…'; }
  showToast('PDFを作成しています…');
  try{
    const blob = await generateInvoicePDFBlob(sourceEl);
    const fileName = `御請求書_${invNo}.pdf`;
    const file = new File([blob], fileName, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'御請求書', text:'御請求書 '+invNo});
    } else {
      showToast('この端末では直接共有できません。🖨印刷・PDF保存でPDFを作成してから、共有機能で送信してください');
    }
  }catch(e){
    if(!(e && e.name==='AbortError')){ // 共有シートのキャンセルは何もしない
      showToast('PDFの作成に失敗しました。もう一度お試しください');
    }
  }finally{
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = origLabel; }
  }
}

/* ============================================================
   プレビュー拡大オーバーレイ（読み取り専用。buildDoc出力を流用）
   ============================================================ */
let dzScale = 1;
function computeFitScale(){
  const avail = window.innerHeight - 48 - 40; // バー48 + 上下パディング40
  let k = avail / 842;
  if(k < 1) k = 1;      // 実寸より小さくはしない
  if(k > 2.5) k = 2.5;
  return Math.round(k*100)/100;
}
function applyDzScale(){
  const stage = document.getElementById('dz-stage');
  const doc = document.getElementById('dz-doc');
  const lbl = document.getElementById('dz-level');
  doc.style.transform = 'scale('+dzScale+')';
  stage.style.width = (595*dzScale)+'px';
  stage.style.height = (842*dzScale)+'px';
  if(lbl) lbl.textContent = Math.round(dzScale*100)+'%';
}
function openDocZoom(s){
  const overlay = document.getElementById('doc-zoom');
  document.getElementById('dz-doc').innerHTML = buildDoc(s);
  dzScale = computeFitScale();
  applyDzScale();
  document.getElementById('dz-scroll').scrollTop = 0;
  overlay.classList.add('open');
  document.addEventListener('keydown', handleDzKeydown);
}
function dzZoom(delta){
  dzScale = Math.min(3, Math.max(0.6, Math.round((dzScale+delta)*100)/100));
  applyDzScale();
}
function closeDocZoom(){
  document.getElementById('doc-zoom').classList.remove('open');
  document.getElementById('dz-doc').innerHTML = '';
  document.removeEventListener('keydown', handleDzKeydown);
}
function handleDzKeydown(e){ if(e.key==='Escape') closeDocZoom(); }

   台帳
   ============================================================ */
function saveInvoiceToLedger(){
  if(!state.invNo){ showToast('伝票Noを入力してください'); return; }
  const idx = ledger.findIndex(r=>r.invNo===state.invNo);
  /* 入力中の伝票Noが「今フォームに読み込んでいる伝票」ではない別の既存伝票と一致する場合、
     そのまま保存すると別の請求書データが上書きされて失われるため、保存前に警告する（第3回修正） */
  if(idx>=0 && state.invNo!==loadedInvNo){
    if(!confirm('伝票No '+state.invNo+' は既に別の請求書で使用されています。\n上書きすると元のデータは失われます。続けますか？')) return;
  }
  upsertCustomerAndVehicle(state.customer, state.vehicle);
  const record = JSON.parse(JSON.stringify(state));
  record.savedAt = new Date().toISOString();
  record.totals = computeTotals(state);
  if(idx>=0) ledger[idx] = record; else ledger.unshift(record);
  const saveOk = saveLedgerToStorage();
  commitInvNo(state.invNo); // 実際に台帳へ保存された伝票Noで高水位マークを確定する（第3回修正）
  loadedInvNo = state.invNo; // 保存後はこの伝票Noが「現在フォームに読み込まれている伝票」になる
  syncDirtyBaseline();
  /* setStoreItem側で保存失敗時のエラートーストは既に表示されているため、直後に矛盾する
     成功トーストを出さないようガードする（中優先度修正） */
  if(saveOk) showToast('台帳に保存しました（伝票No '+record.invNo+'）');
}
function loadInvoiceToForm(invNo){
  /* 同じ伝票を読み込み直す場合（台帳の「開く」プレビューからの「この内容を編集」等）は、確認しても
     無意味なためガードをスキップする（第5回修正） */
  if(invNo!==loadedInvNo && isFormDirty() && !confirm('入力中の内容がまだ保存されていません。\n破棄して続けてよろしいですか？')) return;
  const rec = ledger.find(r=>r.invNo===invNo);
  if(!rec) return;
  state = JSON.parse(JSON.stringify(rec));
  delete state.savedAt; delete state.totals;
  loadedInvNo = state.invNo;
  itemsTouched = true; // 保存済みの実データなので、種別を切替えても無断で消さない
  switchView('create');
  renderCreateView();
  syncDirtyBaseline();
  showToast('伝票No '+invNo+' を読み込みました');
}
function deleteLedgerRow(invNo){
  if(!confirm('伝票No '+invNo+' を削除しますか？この操作は取り消せません。')) return;
  ledger = ledger.filter(r=>r.invNo!==invNo);
  saveLedgerToStorage();
  if(expandedLedgerInvNo===invNo) expandedLedgerInvNo = null;

    <div class="ledger-scroll">

        ${rows}

  `;
}
/* 台帳一覧のボタン（開く/修正/削除/拡大/印刷/共有）をイベント委譲で処理する。
   伝票No（自由入力）をonclick文字列に組み立てるとJS文字列リテラルを脱出されXSSの原因になるため、
   data-*属性に値を格納しdatasetから読み取る（第3回修正）。#ledger-bodyは静的コンテナのため一度だけ結線する */
document.getElementById('ledger-body').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-action]');
  if(!btn || !btn.dataset.invno) return;
  const invNo = btn.dataset.invno;
  const action = btn.dataset.action;
  if(action==='toggle') toggleLedgerPreview(invNo);
  else if(action==='edit') loadInvoiceToForm(invNo);
  else if(action==='delete') deleteLedgerRow(invNo);
  else if(action==='zoom') openLedgerZoom(invNo);
  else if(action==='print') printLedgerRecord(invNo);
  else if(action==='share') shareLedgerRecord(invNo, btn);
});

/* 顧客一覧の表示順：50音順（かな未入力時は会社名（個人名）をフォールバック）。
   第8回修正：宛名（担当者名）欄の廃止で全顧客が会社名（個人名）欄に一本化されたため、
   「会社」→「個人」のグループ分けは意味を持たなくなり単純な50音順一覧に変更 */
function sortCustomersForDisplay(list){
  return [...list].sort((a,b)=>{
    const ka = toHiragana(a.companyKana || a.companyName || '');
    const kb = toHiragana(b.companyKana || b.companyName || '');
    return ka.localeCompare(kb, 'ja');
  });
}
function renderCustomerList(query){
  const area = document.getElementById('cust-list-area');
  const list = sortCustomersForDisplay(searchCustomers(query));
  if(list.length===0){
    area.innerHTML = '<div style="padding:16px; color:#999; font-size:12px;">該当する顧客がいません</div>';
    return;
  }
  area.innerHTML = list.map(c=>{
    const vehs = vehicles.filter(v=>v.customerId===c.id);
    const tags = vehs.map(v=>{
      const soon = isShakenSoon(v.nextShaken);
      return `<span class="cust-veh-tag${soon?' soon':''}" onclick="event.stopPropagation(); selectCustomerVehicle('${escapeHtml(c.id)}','${escapeHtml(v.id)}')">${escapeHtml(v.regNo)||'(ナンバー未登録)'}</span>`;
    }).join('');
    const cnText = getCustomerDisplayName(c) || '（氏名未入力）';
    return `<div class="cust-item${c.id===selectedCustomerId?' selected':''}" onclick="selectCustomer('${escapeHtml(c.id)}')">
      <div class="cn">${escapeHtml(cnText)}</div>
      <div class="ci">${escapeHtml(c.companyKana||'')} ${escapeHtml(c.tel||'')} ${c.code?('コード'+escapeHtml(c.code)):''}</div>
      <div>${tags}</div>
    </div>`;
  }).join('');
}
/* 検索クエリと一致する車両（登録番号・車台番号・型式指定・類別区分番号）をその顧客の中から探す。複数一致する場合は先頭を採用。 */
function findMatchingVehicle(customerId, query){
  const q = String(query||'').trim();
  if(!q) return null;
  return vehicles.find(v => v.customerId===customerId && (
    (v.regNo && v.regNo.includes(q)) ||
    (v.chassisNo && v.chassisNo.includes(q)) ||
    (v.shikiShitei && v.shikiShitei.includes(q)) ||
    (v.ruibetsu && v.ruibetsu.includes(q))
  )) || null;
}
/* selectedCustomerId・selectedVehicleId・expandedCustLedgerInvNoの現在値をもとに一覧＋詳細ペインを再描画する共通処理 */
function renderCustomerDetailPane(){
  const searchInput = document.getElementById('cust-search-input');
  renderCustomerList(searchInput ? searchInput.value : '');
  const c = customers.find(x=>x.id===selectedCustomerId);
  const pane = document.getElementById('cust-detail-pane');
  if(!c){ pane.innerHTML=''; return; }
  pane.innerHTML = buildCustomerDetailHTML(c);
  wireCustomerDetail(c);
}
function selectCustomer(id, query){
  selectedCustomerId = id;
  const searchInput = document.getElementById('cust-search-input');
  const q = query!==undefined ? query : (searchInput ? searchInput.value : '');
  const match = findMatchingVehicle(id, q);
  selectedVehicleId = match ? match.id : null; // 一致なしの場合はbuildCustomerDetailHTML側で1台目にフォールバック
  expandedCustLedgerInvNo = null;
  renderCustomerDetailPane();
}

/* 車両1台分の過去請求書一覧（登録番号で紐付け）。「開く」でその場にA4プレビューを展開する。 */
function buildVehicleLedgerHTML(v){
  if(!v.regNo){
    return `<div class="fsec"><h2>過去の請求書</h2><div style="color:#999; font-size:12px;">登録番号が未登録のため過去データを紐付けできません</div></div>`;
  }
  const recs = ledger.filter(r=>r.vehicle && r.vehicle.regNo===v.regNo)
    .sort((a,b)=>(b.invNo||'').localeCompare(a.invNo||''));
  let html = `<div class="fsec"><h2>過去の請求書</h2>`;
  if(recs.length===0){
    html += `<div style="color:#999; font-size:12px;">この車両の過去請求書はありません</div>`;

    recs.forEach(r=>{
      const total = r.totals ? r.totals.billingAmount : computeTotals(r).billingAmount;
      const isOpen = r.invNo === expandedCustLedgerInvNo;
      html += `<tr>
        <td>${escapeHtml(r.invNo)}</td>
        <td>${toWarekiShort(r.issueDate)||''}</td>

      </tr>`;
      if(isOpen){
        html += `<tr class="ledger-preview-row"><td colspan="5">
          <div class="ledger-preview-wrap">
            <div class="doc-box">${buildDoc(r)}</div>
            ${buildItemsCountWarningHTML(r)}
            <div class="ledger-preview-actions">
              <button class="save" data-action="edit" data-invno="${escapeHtml(r.invNo)}">✏️ この内容を編集</button>
              <button class="zoom" data-action="zoom" data-invno="${escapeHtml(r.invNo)}">🔍 拡大</button>
              <button class="print" data-action="print" data-invno="${escapeHtml(r.invNo)}">🖨 印刷・PDF保存</button>

function wireCustomerDetail(c){
  /* DOM idはkebab-case（cd-company-name等）、顧客オブジェクトのプロパティ名はcamelCase（companyName等）
     と表記が異なるため、idサフィックスとプロパティ名の対応表として持つ（第5回修正） */
  [['company-name','companyName'],['code','code'],['address','address'],['email','email']].forEach(([idSuffix,propKey])=>{
    const el = document.getElementById('cd-'+idSuffix);
    if(!el) return;
    el.addEventListener('input', function(){
      c[propKey] = this.value;
      saveCustomersToStorage();
      const searchInput = document.getElementById('cust-search-input');
      renderCustomerList(searchInput ? searchInput.value : '');
    });
  });
  /* IME変換確定前（isComposing中）に値を上書きすると変換状態が壊れるため、compositionend後にのみ変換する
     （共通化：wireKanaField()。第5回修正） */
  wireKanaField(document.getElementById('cd-company-kana'), kana=>{
    c.companyKana = kana;
    saveCustomersToStorage();
    const searchInput = document.getElementById('cust-search-input');
    renderCustomerList(searchInput ? searchInput.value : '');
  });
  wireHonorificSeg('cd-honorific-seg', function(honorific){
    c.honorific = honorific;
    saveCustomersToStorage();
  });
  wireFormattedField(document.getElementById('cd-postal'), formatPostal, formatted=>{
    c.postal = formatted;
    saveCustomersToStorage();
  });
  wireFormattedField(document.getElementById('cd-tel'), formatPhone, formatted=>{
    c.tel = formatted;
    saveCustomersToStorage();
    const searchInput = document.getElementById('cust-search-input');
    renderCustomerList(searchInput ? searchInput.value : '');
  });
  document.querySelectorAll('.vfield').forEach(el=>{
    el.addEventListener('input', function(){
      const v = vehicles.find(x=>x.id===this.dataset.veh);
      if(!v) return;
      v[this.dataset.key] = this.value;
      saveVehiclesToStorage();
      if(this.dataset.key==='regNo' || this.dataset.key==='nextShaken'){
        const searchInput = document.getElementById('cust-search-input');
        renderCustomerList(searchInput ? searchInput.value : '');
      }
    });
    /* タブラベル・過去請求書一覧はregNo/carNameに依存するため、入力中の再描画（フォーカス喪失）を避けてblur時のみ更新する */
    el.addEventListener('change', function(){
      if(this.dataset.key==='regNo' || this.dataset.key==='carName'){
        const pane = document.getElementById('cust-detail-pane');
        pane.innerHTML = buildCustomerDetailHTML(c);
        wireCustomerDetail(c);
      }
    });
  });
}
function deleteCustomer(id){
  const vehs = vehicles.filter(v=>v.customerId===id);
  const msg = vehs.length
    ? `この顧客を削除しますか？紐づく車両${vehs.length}件も削除されます。この操作は取り消せません。`
    : 'この顧客を削除しますか？この操作は取り消せません。';
  if(!confirm(msg)) return;
  customers = customers.filter(c=>c.id!==id);
  vehicles = vehicles.filter(v=>v.customerId!==id);
  saveCustomersToStorage();
  saveVehiclesToStorage();
  selectedCustomerId = null;
  selectedVehicleId = null;
  expandedCustLedgerInvNo = null;
  renderCustomersView();
  showToast('削除しました');
}
function addVehicleToCustomer(customerId){
  const v = { id: generateId('v', vehicles), customerId, regNo:'', carName:'', modelType:'', engine:'', chassisNo:'',
    shodo:'', regDate:'', shikiShitei:'', ruibetsu:'', mileage:'', nextShaken:'', nextTenken:'' };
  vehicles.push(v);
  saveVehiclesToStorage();
  selectedCustomerId = customerId;
  selectedVehicleId = v.id; // 追加した車両のタブを自動選択
  expandedCustLedgerInvNo = null;
  renderCustomerDetailPane();
  showToast('車両を追加しました');
}
function deleteVehicle(id){
  if(!confirm('この車両を削除しますか？この操作は取り消せません。')) return;
  const v = vehicles.find(x=>x.id===id);
  vehicles = vehicles.filter(x=>x.id!==id);
  saveVehiclesToStorage();
  if(selectedVehicleId===id) selectedVehicleId = null; // buildCustomerDetailHTML側で1台目にフォールバック
  if(v){
    selectedCustomerId = v.customerId;

let reminderPeriodMode = '3m';
let reminderPeriodDays = 90;
function buildReminderRowsHTML(targets){
  if(targets.length===0){
    return '<tr><td colspan="5" class="reminder-empty">対象期間に車検予定のお客様はいません</td></tr>';
  }
  return targets.map(({v,c,diffDays})=>{
    const overdue = diffDays<0;
    const daysLabel = overdue ? `${Math.abs(diffDays)}日超過` : `あと${diffDays}日`;
    const daysClass = overdue ? 'overdue' : (diffDays<=14 ? 'soon' : '');
    const tel = c && c.tel;
    const email = c && c.email;
    return `<tr class="${overdue?'overdue':''}">
      <td>${escapeHtml(c && getCustomerDisplayName(c))||'（氏名未登録）'}</td>
      <td>${escapeHtml(v.carName)||''}　${escapeHtml(v.regNo)||''}</td>
      <td>${toWarekiShort(v.nextShaken)||''}</td>
      <td class="rem-days ${daysClass}">${daysLabel}</td>
      <td class="reminder-actions">
        <button ${tel?'':'disabled'} onclick="sendReminderSMS('${escapeHtml(v.id)}')">SMS</button>
        <button ${email?'':'disabled'} onclick="sendReminderMail('${escapeHtml(v.id)}')">メール</button>
        <button onclick="sendReminderLine('${escapeHtml(v.id)}')">LINE</button>
        <button onclick="copyReminderMsg('${escapeHtml(v.id)}')">コピー</button>
      </td>
    </tr>`;
  }).join('');
}
function renderReminderRowsOnly(){
  const rowsEl = document.getElementById('reminder-rows');
  if(!rowsEl) return;
  rowsEl.innerHTML = buildReminderRowsHTML(getReminderTargets(reminderPeriodDays));
}
function renderReminderView(){
  const body = document.getElementById('reminder-body');
  const rowsHTML = buildReminderRowsHTML(getReminderTargets(reminderPeriodDays));
  body.innerHTML = `
    <div class="reminder-controls">
      <div class="seg" id="reminder-seg">
        <button data-mode="2m" class="${reminderPeriodMode==='2m'?'active':''}">2ヶ月</button>
        <button data-mode="3m" class="${reminderPeriodMode==='3m'?'active':''}">3ヶ月</button>
        <button data-mode="6m" class="${reminderPeriodMode==='6m'?'active':''}">半年</button>
        <button data-mode="custom" class="${reminderPeriodMode==='custom'?'active':''}">任意</button>
      </div>
      <div class="reminder-custom" id="reminder-custom-wrap" style="${reminderPeriodMode==='custom'?'':'display:none;'}">
        <input type="number" id="reminder-custom-days" min="1" value="${reminderPeriodDays}"> 日以内
      </div>
    </div>
    <div class="ledger-scroll">
      <table class="reminder-table">
        <tr><th>顧客名</th><th>車両</th><th>次回車検日</th><th>残日数</th><th>送信</th></tr>
        <tbody id="reminder-rows">${rowsHTML}</tbody>
      </table>
    </div>
  `;
  document.getElementById('reminder-seg').addEventListener('click', function(e){
    const btn = e.target.closest('button[data-mode]');
    if(!btn) return;
    reminderPeriodMode = btn.dataset.mode;
    if(reminderPeriodMode==='2m') reminderPeriodDays = 60;
    else if(reminderPeriodMode==='3m') reminderPeriodDays = 90;
    else if(reminderPeriodMode==='6m') reminderPeriodDays = 180;
    renderReminderView();
  });
  const customInput = document.getElementById('reminder-custom-days');
  if(customInput){
    customInput.addEventListener('input', function(){
      reminderPeriodDays = Number(this.value)||1;
      renderReminderRowsOnly();
    });
  }
}

function wireSettings(){
  const bind = (id, key) => {
    document.getElementById(id).addEventListener('input', function(){
      shop[key] = this.value;
      saveShop();
    });
  };
  bind('s-name','name'); bind('s-kikan','kikan'); bind('s-rep','rep'); bind('s-rep-title','repTitle');
  bind('s-address','address'); bind('s-invoice-no','invoiceNo');
  const bindFormatted = (id, key, formatter) => {
    wireFormattedField(document.getElementById(id), formatter, formatted=>{
      shop[key] = formatted;
      saveShop();
    });
  };
  bindFormatted('s-postal','postal', formatPostal);
  bindFormatted('s-tel','tel', formatPhone);
  bindFormatted('s-fax','fax', formatPhone);

  document.getElementById('s-start-no').addEventListener('input', function(){
    shop.startNo = Number(this.value)||1;
    saveShop();
  });
  document.getElementById('s-template').addEventListener('input', function(){
    templates.shakenReminder = this.value;
    saveTemplatesToStorage();
  });

  /* 担当者リスト（受付・整備）の編集・追加・削除 */
  document.querySelectorAll('.staff-field').forEach(el=>{
    el.addEventListener('input', function(){
      shop[this.dataset.list][Number(this.dataset.idx)] = this.value;
      saveShop();
    });
  });
  document.querySelectorAll('[data-action="add-staff"]').forEach(btn=>{
    btn.addEventListener('click', function(){
      shop[this.dataset.list].push('');
      saveShop();
      renderSettingsView();
    });
  });
  document.querySelectorAll('[data-action="del-staff"]').forEach(btn=>{
    btn.addEventListener('click', function(){
      shop[this.dataset.list].splice(Number(this.dataset.idx),1);
      saveShop();
      renderSettingsView();
    });
  });

  /* 振込先（複数登録可）の編集・追加・削除 */
  document.querySelectorAll('.bank-field').forEach(el=>{
    el.addEventListener('input', function(){
      shop.bankAccounts[Number(this.dataset.idx)][this.dataset.key] = this.value;
      saveShop();
    });
  });
  const addBankBtn = document.getElementById('btn-add-bank');
  if(addBankBtn) addBankBtn.addEventListener('click', function(){
    shop.bankAccounts.push({ id: generateId('bank', shop.bankAccounts), label:'', bankName:'', branch:'', accType:'', accNo:'', holder:'' });
    saveShop();
    renderSettingsView();
  });
  document.querySelectorAll('[data-action="del-bank"]').forEach(btn=>{
    btn.addEventListener('click', function(){
      /* 振込先は最低1件残す。削除前に必ず確認を取る（破壊的操作のため） */
      if(shop.bankAccounts.length<=1){ showToast('振込先は最低1件必要です'); return; }
      if(!confirm('この振込先を削除しますか？この操作は取り消せません。')) return;

}

async function backupJSON(){
  const data = { shop, ledger, customers, vehicles, templates, exportedAt: new Date().toISOString() };
  const json = JSON.stringify(data,null,2);
  const fileName = `ケンズオート_バックアップ_${getTodayISO()}.json`;
  /* 共有シートに対応した端末では、共有先としてGoogleドライブ等を選んで保存できるようにする */
  const file = new File([json], fileName, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'ケンズオート バックアップ', text:'ケンズオートのバックアップデータです'});
      setStoreItem('ken_lastbackup', new Date().toISOString());
      showToast('共有シートからバックアップを保存してください');
      return;
    }catch(e){
      if(e && e.name==='AbortError') return; // 共有シートのキャンセルは何もしない
      // 共有に失敗した場合は下のダウンロード方式にフォールバックする
    }
  }
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
  setStoreItem('ken_lastbackup', new Date().toISOString());
  showToast('バックアップを書き出しました');
}
function restoreJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    let data;
    try{
      data = JSON.parse(reader.result);
    }catch(err){
      showToast('復元に失敗しました：ファイル形式を確認してください');
      e.target.value = '';
      return;
    }
    /* 破壊的操作：復元すると現在保存されている台帳・顧客・車両・設定情報が全てこのファイルの内容に
       置き換わり元に戻せないため、必ず確認を取る（第3回修正） */
    const ok = confirm('バックアップを復元すると、現在保存されている台帳・顧客・車両・設定情報はすべてこのファイルの内容に置き換わります。元に戻すことはできません。復元してよろしいですか？');
    if(!ok){ e.target.value = ''; return; }
    try{
      /* 旧形式のバックアップ（振込先bankAccounts・値引調整③sangakuが未対応の頃のデータ）でも、
         起動時と同じ移行処理を通すことで振込先情報等が消えないようにする（第3回修正） */
      /* 検証・変換はすべて一時変数に対して行い、途中でいずれかが失敗しても実データ（shop/ledger/
         customers/vehicles/templates）を一切書き換えないようにする。すべて成功した場合のみ最後に
         まとめて実変数へ代入することで、「復元に失敗しました」と表示されたのに実際は一部だけ
         書き換わっているというデータ不整合を防ぐ（中優先度修正。なお、ここでの「アトミック」は
         メモリ上の検証・代入の一体性を指し、各localStorageキーへの書き込み自体を1つのトランザクション
         にするものではない） */
      const tmpShop = data.shop ? normalizeShopData(data.shop) : shop;
      const tmpLedger = data.ledger ? normalizeLedgerData(data.ledger) : ledger;
      const tmpCustomers = data.customers ? normalizeCustomersData(data.customers) : customers;
      const tmpVehicles = data.vehicles ? normalizeVehiclesData(data.vehicles) : vehicles;
      if(data.templates!==undefined && (data.templates===null || typeof data.templates!=='object')){
        throw new Error('テンプレートデータの形式が不正です');
      }
      const tmpTemplates = data.templates ? Object.assign(createDefaultTemplates(), data.templates) : templates;

      shop = tmpShop;
      ledger = tmpLedger;
      customers = tmpCustomers;
      vehicles = tmpVehicles;
      templates = tmpTemplates;
      /* 復元後のledger/customersを踏まえ、伝票No・お客様コードの高水位マークも追いつかせる（第5回修正） */
      ensureSeqBaseline();
      const okShop = saveShop();
      const okLedger = saveLedgerToStorage();
      const okCustomers = saveCustomersToStorage();
      const okVehicles = saveVehiclesToStorage();
      const okTemplates = saveTemplatesToStorage();
      renderSettingsView();
      renderLedgerView();
      /* setStoreItem側で保存失敗時のエラートーストは既に表示されているため、直後に矛盾する
         成功トーストを出さないようガードする（中優先度修正） */
      if(okShop && okLedger && okCustomers && okVehicles && okTemplates) showToast('復元しました');
    }catch(err){
      showToast('復元に失敗しました：ファイル形式を確認してください');
    }finally{
      e.target.value = ''; // 同じファイルを続けて選択した場合もchangeイベントが発火するようリセット
    }
  };
  reader.onerror = function(){
    showToast('ファイルの読み込みに失敗しました。もう一度お試しください');
    e.target.value = '';
  };
  reader.readAsText(file);
}

/* ============================================================
   ビュー切替
   ============================================================ */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('#main-tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='ledger') renderLedgerView();
  if(name==='customers') renderCustomersView();
  if(name==='reminder') renderReminderView();
  if(name==='settings') renderSettingsView();
}
document.getElementById('main-tabs').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  switchView(btn.dataset.view);
});
document.getElementById('btn-new').addEventListener('click', function(){
  if(isFormDirty() && !confirm('入力中の内容がまだ保存されていません。\n破棄して続けてよろしいですか？')) return;
  state = createDefaultState();
  state.invNo = getNextInvNo();
  loadedInvNo = state.invNo;
  seedItemsForType(state.type);
  itemsTouched = false;
  switchView('create');
  renderCreateView();
  syncDirtyBaseline();
  showToast('新規作成しました（伝票No '+state.invNo+'）');
});

/* ブラウザのショートカット（Cmd/Ctrl+P等）やメニューからアプリの印刷ボタンを経由せず印刷された場合、
   #print-areaが空または前回印刷した別の請求書のまま印字されてしまうのを防ぐフォールバック。
   アプリの印刷ボタン（doPrint/printLedgerRecord）から呼ばれた場合はprintAreaReadyForNativePrintが
   trueになっており、直前に正しい内容へ同期済みのためここでは何もしない（第4回修正） */
window.addEventListener('beforeprint', function(){
  if(printAreaReadyForNativePrint){
    printAreaReadyForNativePrint = false;
    return;
  }
  const createActive = document.getElementById('view-create').classList.contains('active');
  if(createActive){
    /* 「請求書作成」画面がアクティブな場合は、入力中の最新内容で#print-areaを同期する */
    syncPrintArea(state);
  } else {
    /* 台帳一覧・顧客カルテ等、印刷対象を一意に特定できない画面では、古い請求書を誤って印刷してしまう
       方が空白ページより実害が大きいため、#print-areaを空にして案内を表示する */
    document.getElementById('print-area').innerHTML = '';
    showToast('印刷する請求書が特定できませんでした。請求書を開いてから、画面内の🖨印刷ボタンをご利用ください');
  }
});

/* ============================================================
   起動
   ============================================================ */
ensureSeqBaseline();
state.invNo = getNextInvNo();
loadedInvNo = state.invNo;
seedItemsForType(state.type);
itemsTouched = false;
renderCreateView();
/* プライベートブラウズ等でlocalStorageが使えない場合、入力内容は画面を閉じると消える
   （memStoreへのフォールバックのみ）。以前は無警告だったため起動時に1回だけ案内する（軽微修正） */
if(!STORAGE_OK){
  showToast('この端末では入力内容が保存されません（プライベートブラウズ等の可能性があります）。作業前にバックアップの書き出し方法をご確認ください');
}
syncDirtyBaseline();
