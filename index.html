<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ケンズオート 請求書アプリ</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0; background:#eeeeea; font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif; color:#222;}
  button{cursor:pointer; font-family:inherit;}
  input, select{font-family:inherit; font-size:14px;}

  /* ── トップナビ ── */
  .topnav{position:sticky; top:0; z-index:60; background:#1c2430; color:#fff;
    padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .topnav h1{font-size:14px; font-weight:700; margin:0;}
  .tabs{display:flex; gap:4px; margin-left:8px;}
  .tabs button{padding:8px 16px; border:none; border-radius:5px; font-size:13px; font-weight:600;
    background:#2b3444; color:#bbb;}
  .tabs button.active{background:#3a4658; color:#fff;}
  .topnav .spacer{flex:1;}
  .btn-primary{padding:8px 16px; border:none; border-radius:5px; font-size:13px; font-weight:700;
    background:linear-gradient(135deg,#e7c578,#b8942c); color:#1c2430;}
  .btn-ghost{padding:8px 14px; border:1px solid #555; border-radius:5px; font-size:13px; font-weight:600;
    background:transparent; color:#ddd;}
  .toast{position:fixed; top:56px; left:50%; transform:translateX(-50%); background:#1c2430; color:#fff;
    padding:8px 18px; border-radius:20px; font-size:13px; z-index:200; box-shadow:0 4px 16px rgba(0,0,0,.3);
    opacity:0; pointer-events:none; transition:opacity .25s;}
  .toast.show{opacity:1;}

  .view{display:none;}
  .view.active{display:block;}

  /* ── 請求書作成：2ペイン ── */
  #view-create.active{display:flex; gap:0; align-items:flex-start;}
  .form-pane{width:46%; min-width:380px; max-width:560px; padding:16px 16px 60px; height:calc(100vh - 46px); overflow-y:auto;}
  .preview-pane{flex:1; position:sticky; top:46px; height:calc(100vh - 46px); overflow-y:auto;
    display:flex; flex-direction:column; align-items:center; padding:20px 12px; background:#e2e2dd;}
  @media (max-width:900px){
    #view-create{flex-direction:column;}
    .form-pane, .preview-pane{width:100%; max-width:none; height:auto; position:static;}
  }

  .fsec{background:#fff; border-radius:8px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .fsec h2{font-size:13px; font-weight:700; margin:0 0 10px; color:#1c2430; border-left:4px solid #b8942c; padding-left:8px;}
  .frow{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
  .frow label{width:104px; flex-shrink:0; font-size:12px; color:#555;}
  .frow input[type=text], .frow input[type=date], .frow input[type=number], .frow select{
    flex:1; padding:7px 9px; border:1px solid #ccc; border-radius:4px; font-size:14px; width:100%; min-height:36px; min-width:0;}
  .frow2{display:flex; gap:8px;}
  .frow2 .frow{flex:1; min-width:0;}
  /* 375〜430px幅のモバイル縦画面では2カラムが窮屈になるため1カラムに積む（CLAUDE.md 4章） */
  @media (max-width:480px){
    .frow2{flex-direction:column; gap:0;}
  }
  .seg{display:flex; border:1px solid #999; border-radius:5px; overflow:hidden;}
  .seg button{flex:1; padding:8px; border:none; background:#f4f4f0; font-size:13px; font-weight:600; color:#555;}
  .seg button.active{background:#1c2430; color:#fff;}

  /* 明細テーブル（フォーム側） */
  .item-form-table{width:100%; border-collapse:collapse; font-size:12px;}
  .item-form-table th{background:#f4f4f0; padding:5px 4px; font-size:11px; color:#666; text-align:center; border-bottom:1px solid #ddd;}
  .item-form-table td{padding:3px 3px; border-bottom:1px solid #eee;}
  .item-form-table input{width:100%; padding:5px 4px; border:1px solid #ddd; border-radius:3px; font-size:12px;}
  .item-form-table input.num{text-align:right;}
  .item-form-table .sub{text-align:right; font-size:12px; color:#333; padding-right:6px;}
  .item-form-table .del{background:#f8d8d8; color:#a33; border:none; border-radius:3px; width:24px; height:24px; font-size:13px;}
  .add-row-btn{margin-top:8px; padding:7px 14px; border:1px dashed #999; border-radius:5px; background:#fafaf7; font-size:12px; color:#555; width:100%;}
  .items-warning{font-size:11px; color:#a33; margin-top:6px;}

  .action-bar{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;}
  .action-bar button{flex:1 1 45%; min-width:120px; padding:12px; border:none; border-radius:6px; font-size:13px; font-weight:700;}
  .action-bar .save{background:#2A5D8F; color:#fff;}
  .action-bar .clear{background:#f0e0e0; color:#a33;}
  .action-bar .print{background:linear-gradient(135deg,#e7c578,#b8942c); color:#1c2430;}
  .action-bar .share{background:#3a4658; color:#fff;}
  .action-bar button:disabled{opacity:.6; cursor:not-allowed;}

  /* ── 台帳ビュー ── */
  #view-ledger{padding:20px;}
  .ledger-scroll{overflow-x:auto;}
  .ledger-table{width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .ledger-table th{background:#1c2430; color:#fff; padding:9px 10px; font-size:12px; text-align:left;}
  .ledger-table td{padding:9px 10px; font-size:13px; border-bottom:1px solid #eee;}
  .ledger-table tr:last-child td{border-bottom:none;}
  .ledger-table .amt{text-align:right; font-weight:700;}
  .ledger-actions button{margin-right:4px; padding:5px 10px; font-size:11px; border:1px solid #ccc; border-radius:4px; background:#fff;}
  .ledger-actions button.active{background:#1c2430; color:#fff; border-color:#1c2430;}
  .ledger-empty{padding:40px; text-align:center; color:#999; font-size:13px;}
  .ledger-preview-row td{background:#e2e2dd; padding:28px; border-bottom:1px solid #eee;}
  .ledger-preview-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .ledger-preview-actions{display:flex; gap:8px;}
  .ledger-preview-actions button{padding:10px 20px; border:none; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer;}
  .ledger-preview-actions .save{background:#2A5D8F; color:#fff;}
  .ledger-preview-actions .zoom{background:#3a4658; color:#fff;}
  .ledger-preview-actions .print{background:linear-gradient(135deg,#e7c578,#b8942c); color:#1c2430;}
  .ledger-preview-actions .share{background:#5b3a90; color:#fff;}
  .ledger-preview-actions button:disabled{opacity:.6; cursor:not-allowed;}

  /* ── 顧客カルテビュー ── */
  #view-customers.active{display:flex; gap:0; align-items:flex-start;}
  .cust-list-pane{width:360px; min-width:300px; padding:16px; height:calc(100vh - 46px); overflow-y:auto; border-right:1px solid #ddd; background:#f7f7f4;}
  .cust-detail-pane{flex:1; padding:16px; height:calc(100vh - 46px); overflow-y:auto;}
  @media (max-width:900px){
    #view-customers{flex-direction:column;}
    .cust-list-pane, .cust-detail-pane{width:100%; height:auto; border-right:none;}
  }
  .cust-search{width:100%; padding:9px 12px; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-bottom:10px;}
  .cust-item{padding:10px 12px; border-radius:6px; margin-bottom:6px; background:#fff; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .cust-item.selected{background:#1c2430; color:#fff;}
  .cust-item .cn{font-weight:700; font-size:13px;}
  .cust-item .ci{font-size:11px; color:#888;}
  .cust-item.selected .ci{color:#bbb;}
  .cust-veh-tag{display:inline-block; font-size:10px; background:#eee; color:#555; border-radius:10px; padding:2px 8px; margin:4px 4px 0 0; cursor:pointer;}
  .cust-item.selected .cust-veh-tag{background:#3a4658; color:#fff;}
  .cust-veh-tag.soon{background:#f3c563; color:#553; font-weight:700;}

  /* ── 顧客カルテ：車両タブ ── */
  .veh-tabs{display:flex; gap:6px; flex-wrap:wrap; margin:16px 0 10px;}
  .veh-tabs button{padding:8px 14px; border:1px solid #ccc; border-radius:16px; background:#fff; font-size:12px; font-weight:600; color:#555; min-height:36px;}
  .veh-tabs button.active{background:#1c2430; color:#fff; border-color:#1c2430;}
  .veh-tabs button.add-veh-tab{border-style:dashed; color:#2A5D8F; background:#fafaf7;}

  /* ── 宛名サジェスト ── */
  .suggest-box{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #ccc;
    border-radius:0 0 6px 6px; box-shadow:0 6px 16px rgba(0,0,0,.15); z-index:80; max-height:240px; overflow-y:auto; display:none;}
  .suggest-box.open{display:block;}
  .suggest-item{padding:8px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid #f0f0f0;}
  .suggest-item:hover, .suggest-veh:hover{background:#f4f4f0;}
  .suggest-item .si-sub{font-size:11px; color:#888;}
  .suggest-item.new{color:#2A5D8F; font-weight:700;}
  .suggest-veh{padding:8px 12px; font-size:12px; cursor:pointer; border-bottom:1px solid #f0f0f0;}

  /* ── 車検リマインドビュー ── */
  #view-reminder{padding:20px;}
  .reminder-controls{display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
  .reminder-controls .seg{width:auto;}
  .reminder-controls .seg button{padding:8px 16px;}
  .reminder-custom{display:flex; align-items:center; gap:6px; font-size:13px; color:#555;}
  .reminder-custom input{width:70px; padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:13px;}
  .reminder-table{width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .reminder-table th{background:#1c2430; color:#fff; padding:9px 10px; font-size:12px; text-align:left;}
  .reminder-table td{padding:9px 10px; font-size:13px; border-bottom:1px solid #eee; vertical-align:middle;}
  .reminder-table tr:last-child td{border-bottom:none;}
  .reminder-table tr.overdue td{background:#fdecec;}
  .rem-days{font-weight:700;}
  .rem-days.overdue{color:#c33;}
  .rem-days.soon{color:#b8942c;}
  .reminder-actions button{margin-right:4px; padding:6px 10px; font-size:11px; border:1px solid #ccc; border-radius:4px; background:#fff;}
  .reminder-actions button:disabled{opacity:.4; cursor:not-allowed;}
  .reminder-empty{padding:40px; text-align:center; color:#999; font-size:13px;}

  /* ── 設定ビュー ── */
  #view-settings{padding:20px; max-width:520px;}

  /* ── A4 帳票（フェーズ0の実証済みスタイルを移植） ── */
  #docWrap{background:#fff; box-shadow:0 6px 28px rgba(0,0,0,.28); flex-shrink:0;}
  #doc, .doc-box{position:relative; width:595px; height:842px; background:#fff; box-sizing:border-box;
    padding:11px 23px 8px; font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','MS Mincho',serif;
    color:#111; font-size:9.2px; line-height:1.3;}
  #doc table, .doc-box table{border-collapse:collapse; width:100%;}
  .doc-box{box-shadow:0 6px 28px rgba(0,0,0,.22); margin:0 auto;}
  .hd-row{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px;}
  .hd-left{font-size:9px; line-height:1.6;}
  .hd-title{text-align:center; flex:1;}
  .hd-title .t1{font-size:17.5px; font-weight:700; letter-spacing:.5em; padding-left:.5em;}
  .hd-right table{width:170px; font-size:8.7px;}
  .hd-right td{border:1px solid #111; padding:1px 4px;}
  .hd-right td.lbl{background:#f2f2ee; width:58px; color:#333; white-space:nowrap;}
  .hd-right td.val-kubun{font-size:7.4px;}
  .veh-table td.faded{color:#999;}
  .parties{display:flex; justify-content:space-between; margin:3px 0 5px; gap:14px;}
  .p-col{width:48%; font-size:8.7px; line-height:1.4;}
  .p-col .name{font-size:11.5px; font-weight:700; border-bottom:1.4px solid #111; padding-bottom:2px; margin:1px 0 2px; display:inline-block;}
  .p-col .person{font-size:8.3px; color:#333;}
  .p-col .code{font-size:8.5px; color:#333; margin-top:2px;}
  .p-col.right{text-align:left;}
  .p-col.right .kikan{font-size:7.8px; color:#555;}
  .p-col.right .shopname{font-size:11.5px; font-weight:700; margin:1px 0;}
  .ph{color:#b23; font-size:7.8px;}
  .veh-table{margin-bottom:3px; font-size:8.5px;}
  .veh-table td{border:1px solid #111; padding:1.5px 4px;}
  .veh-table tr:first-child td{background:#f2f2ee; color:#333; font-size:8px; text-align:center;}
  .items-table{margin-bottom:1.5px; font-size:8.5px; table-layout:fixed;}
  .items-table.dense{font-size:7.4px;}
  .items-table col.c-name{width:auto;}
  .items-table col.c-num{width:58px;}
  .items-table th{border:1px solid #111; background:#e8e8e2; padding:2px 3px; font-weight:700; text-align:center;}
  .items-table td{border:1px solid #111; padding:1px 4px; height:auto;}
  .items-table.dense td{padding:0.3px 3px;}
  .items-table td.num{text-align:right;}
  .foot-row{display:flex; justify-content:space-between; gap:12px; margin-top:1px;}
  .foot-l{width:56%; font-size:8.7px;}
  .foot-r{width:42%; font-size:8.7px;}
  .cost-table td{border:1px solid #111; padding:1px 5px;}
  .cost-table td.lbl{background:#f8f8f6; color:#444;}
  .cost-table td.val{text-align:right; width:72px;}
  .small-sum td{border:1px solid #111; padding:1px 5px; font-size:8.3px;}
  .small-sum td.lbl{background:#f8f8f6; color:#555;}
  .small-sum td.val{text-align:right; width:72px;}
  .next-box{font-size:8.3px; margin-top:2px; line-height:1.25;}
  .thanks{font-size:7.5px; color:#333; line-height:1.2; margin-top:2px;}
  .bank{font-size:7.5px; color:#333; line-height:1.15; margin-top:1px; border-top:1px solid #ddd; padding-top:1px;}
  .r-table{margin-bottom:4px;}
  .r-table td{border:1px solid #111; padding:1.5px 5px;}
  .r-table td.lbl{background:#f8f8f6; color:#444; width:60px;}
  .r-table td.val{text-align:right; width:72px;}
  .req-box{border:2px solid #111; border-radius:6px; padding:3px 8px; margin-top:2px; text-align:center;}
  .req-box .rl{font-size:10px; font-weight:700;}
  .req-box .rsub{font-size:8px; color:#666;}
  .req-box .rv{font-size:15.5px; font-weight:700; margin-top:2px;}

  /* ── プレビュー拡大オーバーレイ ── */
  .btn-zoom{margin-bottom:12px; padding:8px 16px; border:none; border-radius:6px; font-size:13px; font-weight:700;
    background:#3a4658; color:#fff; align-self:center;}
  #docWrap{cursor:zoom-in;}
  #docZoom{display:none; position:fixed; top:0; right:0; bottom:0; left:0; z-index:300; background:rgba(20,24,32,.82);}
  #docZoom.open{display:block;}
  #docZoom .dz-bar{position:absolute; top:0; right:0; left:0; height:48px; display:flex; align-items:center;
    justify-content:flex-end; gap:8px; padding:0 14px; z-index:2; background:rgba(28,36,48,.6);}
  #docZoom .dz-bar button{padding:7px 14px; border:none; border-radius:6px; font-size:15px; font-weight:700;
    background:#3a4658; color:#fff; min-width:40px;}
  #docZoom .dz-bar button.dz-close{background:linear-gradient(135deg,#e7c578,#b8942c); color:#1c2430;}
  #docZoom .dz-level{color:#fff; font-size:13px; min-width:52px; text-align:center;}
  #docZoom .dz-scroll{position:absolute; top:48px; right:0; bottom:0; left:0; overflow:auto; padding:20px;
    display:flex; justify-content:center; align-items:flex-start;}
  #docZoom .dz-stage{position:relative; margin:0 auto; flex-shrink:0;}
  #docZoom #dzDoc{position:absolute; top:0; left:0; margin:0; transform-origin:top left;
    box-shadow:0 10px 40px rgba(0,0,0,.5);}

  @media print{
    body>*{display:none !important;}
    #docZoom{display:none !important;}
    #printArea{display:block !important; position:static !important; background:#fff !important;}
    #printArea > div{
      transform:scale(1.3333) !important;
      transform-origin:top left !important;
      width:595px; height:842px;
      overflow:hidden;
      page-break-after:avoid; break-after:avoid;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    @page{size:A4; margin:0;}
  }
  #printArea{display:none;}

  /* 数値入力欄のスピナー（上下ボタン）はデフォルトで非表示にする。数量欄（.qty-num）のみ下で復活させる */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }
  input[type=number].qty-num{ -moz-appearance:number-input; }
  input[type=number].qty-num::-webkit-outer-spin-button,
  input[type=number].qty-num::-webkit-inner-spin-button{ -webkit-appearance:auto; }
</style>
</head>
<body>

<div class="topnav">
  <h1>ケンズオート 請求書アプリ</h1>
  <div class="tabs" id="mainTabs">
    <button data-view="create" class="active">請求書作成</button>
    <button data-view="ledger">台帳</button>
    <button data-view="customers">顧客カルテ</button>
    <button data-view="reminder">車検リマインド</button>
    <button data-view="settings">⚙設定</button>
  </div>
  <div class="spacer"></div>
  <button class="btn-ghost" id="btnNew">＋ 新規作成</button>
</div>
<div class="toast" id="toast"></div>

<!-- ============ 請求書作成 ============ -->
<div class="view active" id="view-create">
  <div class="form-pane" id="formPane"></div>
  <div class="preview-pane">
    <button class="btn-zoom" id="btnZoomDoc">🔍 拡大表示</button>
    <div id="docWrap"><div id="doc"></div></div>
  </div>
</div>

<!-- ============ 台帳 ============ -->
<div class="view" id="view-ledger">
  <div id="ledgerBody"></div>
</div>

<!-- ============ 顧客カルテ ============ -->
<div class="view" id="view-customers">
  <div class="cust-list-pane" id="custListPane"></div>
  <div class="cust-detail-pane" id="custDetailPane"></div>
</div>

<!-- ============ 車検リマインド ============ -->
<div class="view" id="view-reminder">
  <div id="reminderBody"></div>
</div>

<!-- ============ 設定 ============ -->
<div class="view" id="view-settings">
  <div id="settingsBody"></div>
</div>

<div id="printArea"></div>

<!-- ============ プレビュー拡大オーバーレイ ============ -->
<div id="docZoom">
  <div class="dz-bar">
    <button onclick="dzZoom(-0.25)" aria-label="縮小">−</button>
    <span id="dzLevel" class="dz-level">100%</span>
    <button onclick="dzZoom(0.25)" aria-label="拡大">＋</button>
    <button class="dz-close" onclick="closeDocZoom()">✕ 閉じる</button>
  </div>
  <div class="dz-scroll" id="dzScroll" onclick="if(event.target===this) closeDocZoom()">
    <div class="dz-stage" id="dzStage"><div class="doc-box" id="dzDoc"></div></div>
  </div>
</div>

<!-- PDF共有機能のために追加：html2canvasで帳票をキャンバス化し、jsPDFでA4サイズの実際のPDFファイルを生成して共有する -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
/* ============================================================
   ユーティリティ
   ============================================================ */
function yen(n){
  n = Math.round(Number(n)||0);
  const sign = n<0 ? '-' : '';
  return sign + Math.abs(n).toLocaleString('ja-JP');
}
function todayISO(){
  const d = new Date();
  const p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function reiwaParts(iso){
  if(!iso) return null;
  const [y,m,dd] = iso.split('-').map(Number);
  /* "R7.7.8" 等の旧仕様自由入力文字列はハイフン区切りでないためNaNになる。
     NaN<1 は false 判定になり素通りしてしまうため、有限数チェックを明示する */
  if(!Number.isFinite(y) || !Number.isFinite(m) || !Number.isFinite(dd)) return null;
  const ry = y - 2018;
  if(ry < 1) return null;
  return {ry, m, dd};
}
function toWarekiLong(iso){ const p=reiwaParts(iso); return p ? `令和${p.ry}年${p.m}月${p.dd}日` : ''; }
function toWarekiShort(iso){ const p=reiwaParts(iso); return p ? `R${p.ry}.${p.m}.${p.dd}` : ''; }
/* 初度・登録年月日は西暦のまま表示する（複数元号対応が不要なため） */
function formatMonthJP(ym){
  if(!ym) return '';
  const [y,m] = String(ym).split('-').map(Number);
  if(!Number.isFinite(y) || !Number.isFinite(m)) return '';
  return `${y}年${m}月`;
}

function genId(prefix, arr){
  let max = 0;
  arr.forEach(x=>{
    const m = /^\D*(\d+)$/.exec(x.id||'');
    if(m){ const n=parseInt(m[1],10); if(n>max) max=n; }
  });
  return prefix + (max+1);
}
function toHiragana(s){
  return String(s||'').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
/* かな欄はカタカナで統一表示する（ひらがな入力を自動変換） */
function toKatakana(s){
  return String(s||'').replace(/[ぁ-ん]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
/* 郵便番号：数字以外を除去し3-4桁で自動整形 */
function formatPostal(raw){
  const d = String(raw||'').replace(/[^0-9]/g,'').slice(0,7);
  if(d.length<=3) return d;
  return d.slice(0,3)+'-'+d.slice(3);
}
/* 電話番号：携帯（090/080/070/050始まり）は3-4-4、それ以外は簡易的に2-4-4で自動整形 */
function formatPhone(raw){
  const d = String(raw||'').replace(/[^0-9]/g,'').slice(0,11);
  const mobile = /^(090|080|070|050)/.test(d);
  const a = mobile ? 3 : 2;
  if(d.length<=a) return d;
  if(d.length<=a+4) return d.slice(0,a)+'-'+d.slice(a);
  return d.slice(0,a)+'-'+d.slice(a,a+4)+'-'+d.slice(a+4);
}
/* お客様コード：既存の5桁数値コードの最大値+1を5桁ゼロ埋めで返す */
function nextCustomerCode(){
  let max = 0;
  customers.forEach(c=>{
    if(c.code && /^\d{5}$/.test(c.code)){ const n=parseInt(c.code,10); if(n>max) max=n; }
  });
  return String(max+1).padStart(5,'0');
}
/* 台帳・顧客一覧・サジェストで共通して使う宛名表示ルール：会社名があれば会社名（個人名）主表示、無ければ個人名のみ */
function customerDisplayName(cust){
  if(!cust) return '';
  if(cust.companyName) return cust.companyName + (cust.name ? `（${cust.name}）` : '');
  return cust.name || '';
}
function searchCustomers(query){
  const q = String(query||'').trim();
  if(!q) return customers;
  const qh = toHiragana(q);
  return customers.filter(c=>{
    if(toHiragana(c.name).indexOf(qh)===0) return true;
    if(c.kana && toHiragana(c.kana).indexOf(qh)===0) return true;
    if(c.code && c.code.indexOf(q)===0) return true;
    if(c.tel && c.tel.includes(q)) return true;
    if(c.companyName && toHiragana(c.companyName).indexOf(qh)===0) return true;
    return vehicles.some(v=>v.customerId===c.id && (
      (v.regNo && v.regNo.includes(q)) ||
      (v.chassisNo && v.chassisNo.includes(q)) ||
      (v.shikiShitei && v.shikiShitei.includes(q)) ||
      (v.ruibetsu && v.ruibetsu.includes(q))
    ));
  });
}

/* 請求書保存時に顧客・車両カルテへ反映（アップサート）。空欄の項目は既存値を上書きしない。 */
function upsertCustomerAndVehicle(cust, veh){
  if(!cust || (!cust.name && !cust.code && !cust.tel)) return null;
  let c = null;
  let isNewCustomer = false;
  if(cust.code) c = customers.find(x=>x.code && x.code===cust.code);
  if(!c && cust.name) c = customers.find(x=>x.name===cust.name && (x.tel||'')===(cust.tel||''));
  if(!c){
    c = { id: genId('c', customers), name:'', companyName:'', companyKana:'', kana:'', tel:'', postal:'', address:'', code:'', email:'' };
    customers.push(c);
    isNewCustomer = true;
  }
  ['name','companyName','companyKana','kana','tel','postal','address','code','email'].forEach(k=>{ if(cust[k]) c[k]=cust[k]; });
  if(isNewCustomer && !c.code) c.code = nextCustomerCode();

  if(veh && veh.regNo){
    let v = vehicles.find(x=>x.customerId===c.id && x.regNo===veh.regNo);
    if(!v){
      v = { id: genId('v', vehicles), customerId: c.id, regNo:'', carName:'', modelType:'', engine:'', chassisNo:'',
        shodo:'', regDate:'', shikiShitei:'', ruibetsu:'', mileage:'', nextShaken:'', nextTenken:'' };
      vehicles.push(v);
    }
    ['regNo','carName','modelType','engine','chassisNo','shodo','regDate','shikiShitei','ruibetsu','mileage','nextShaken','nextTenken'].forEach(k=>{
      if(veh[k]) v[k]=veh[k];
    });
  }
  saveCustomersToStorage();
  saveVehiclesToStorage();
  return c.id;
}
function isShakenSoon(iso){

  const diffDays = (new Date(iso) - new Date(todayISO())) / 86400000;
  return diffDays >= 0 && diffDays <= 60;
}

function fillTemplate(tpl, c, v){
  c = c || {}; v = v || {};
  return String(tpl||'')
    .replace(/\{顧客名\}/g, c.name||'')
    .replace(/\{車両\}/g, v.carName||'')
    .replace(/\{ナンバー\}/g, v.regNo||'')
    .replace(/\{次回車検日\}/g, toWarekiShort(v.nextShaken)||'未設定');
}
function buildReminderMessage(c, v){
  return fillTemplate(templates.shakenReminder, c, v);
}
/* nextShaken が「今日〜今日＋days日」の車両を対象に、超過→間近→先の順（残日数昇順）で抽出 */
function getReminderTargets(days){
  const todayMs = new Date(todayISO()).getTime();
  const list = [];
  vehicles.forEach(v=>{
    if(!v.nextShaken) return;
    const diffDays = Math.round((new Date(v.nextShaken).getTime() - todayMs) / 86400000);
    if(diffDays <= days){
      list.push({ v, c: customers.find(x=>x.id===v.customerId) || null, diffDays });
    }
  });
  list.sort((a,b)=>a.diffDays-b.diffDays);
  return list;
}
function copyToClipboard(text, msg){
  const done = ()=>toast(msg||'コピーしました');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0'; ta.style.right='0'; ta.style.bottom='auto';
  ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

/* ============================================================
   計算（フェーズ0の検算ロジックを共通関数化）
   ============================================================ */
function computeTotals(s){
  const c = s.costs;
  /* 諸費用の無地行（extra1〜3）：課税指定があれば10%課税対象額に、いずれにせよ①諸費用合計には含める */
  const extras = [c.extra1, c.extra2, c.extra3].map(e=>e||{amount:0,taxable:false});
  const extraTaxable = extras.reduce((sum,e)=>sum+(e.taxable?(Number(e.amount)||0):0),0);
  const extraAll = extras.reduce((sum,e)=>sum+(Number(e.amount)||0),0);
  const gijutsuryou = s.items.reduce((sum,r)=>sum+(Number(r.tech)||0),0);
  const buhindai = s.items.reduce((sum,r)=>sum+(Number(r.qty)||0)*(Number(r.price)||0),0);
  const nebiki = Number(s.nebiki)||0;
  const taxBase = gijutsuryou+nebiki+buhindai+(Number(c.tester)||0)+(Number(c.jimu)||0)+extraTaxable;
  const shohizei = Math.round(taxBase*0.1);
  const goukei2 = gijutsuryou+nebiki+buhindai+shohizei;
  const shohi1 = (Number(c.jibaiseki)||0)+(Number(c.jyuryozei)||0)+(Number(c.inshi)||0)+(Number(c.gijutsu)||0)+(Number(c.tester)||0)+(Number(c.jimu)||0)+(Number(c.daikou)||0)+extraAll;
  /* sangakuは旧仕様（数値のみ）と新仕様（{label,amount}）の両方があり得るため両対応する */
  const sangakuRaw = s.sangaku;
  const sangaku = Number(sangakuRaw && typeof sangakuRaw==='object' ? sangakuRaw.amount : sangakuRaw) || 0;
  const uriage = shohi1+goukei2-sangaku;
  const seikyu = uriage;
  const kazei10 = taxBase;
  const kazei10zei = shohizei;
  const kazeigai = uriage-kazei10-kazei10zei;
  return { gijutsuryou, buhindai, nebiki, shohizei, goukei2, shohi1, sangaku, uriage, seikyu, kazei10, kazei10zei, kazeigai };
}

function renderItemFormTable(){
  const tbl = document.getElementById('itemFormTable');
  let html = `<tr><th style="width:38%">品目</th><th>技術料</th><th>数量</th><th>部品単価</th><th>部品小計</th><th></th></tr>`;
  state.items.forEach((r,i)=>{
    const sub = (Number(r.qty)||0)*(Number(r.price)||0);
    html += `<tr>
      <td><input type="text" value="${esc(r.name)}" oninput="onItemInput(${i},'name',this.value)"></td>
      <td><input type="number" class="num" value="${r.tech||''}" oninput="onItemInput(${i},'tech',this.value)"></td>
      <td><input type="number" class="num qty-num" value="${r.qty||''}" oninput="onItemInput(${i},'qty',this.value)"></td>
      <td><input type="number" class="num" value="${r.price||''}" oninput="onItemInput(${i},'price',this.value)"></td>
      <td class="sub" id="itemSub${i}">${sub?yen(sub):''}</td>
      <td><button class="del" onclick="deleteItemRow(${i})">✕</button></td>
    </tr>`;
  });
  tbl.innerHTML = html;
}
/* 明細が「種別選択時の定型そのまま」＝未編集かどうか。未編集ならトグル時に安全に入れ替えられる。 */
let itemsTouched = false;

function onItemInput(i, key, val){
  itemsTouched = true;
  if(key==='name') state.items[i].name = val;
  else state.items[i][key] = Number(val)||0;
  if(key!=='name'){
    const sub = (Number(state.items[i].qty)||0)*(Number(state.items[i].price)||0);
    const el = document.getElementById('itemSub'+i);
    if(el) el.textContent = sub?yen(sub):'';
  }
  renderPreview();
}
function addItemRow(){
  itemsTouched = true;
  state.items.push({name:'', tech:0, qty:0, price:0});
  renderItemFormTable();
  renderPreview();
}
function deleteItemRow(i){
  itemsTouched = true;
  state.items.splice(i,1);
  renderItemFormTable();
  renderPreview();
}

function wireCustSuggest(){
  const input = document.getElementById('f-cust-name');
  const box = document.getElementById('custSuggest');
  if(!input || !box) return;
  input.addEventListener('input', function(){ showCustSuggest(this.value, box); });
  input.addEventListener('focus', function(){ showCustSuggest(this.value, box); });
}
/* 会社名欄からも同じカルテ検索候補を出せるようにする */
function wireCompanySuggest(){
  const input = document.getElementById('f-cust-companyName');
  const box = document.getElementById('custCompanySuggest');
  if(!input || !box) return;
  input.addEventListener('input', function(){ showCustSuggest(this.value, box); });
  input.addEventListener('focus', function(){ showCustSuggest(this.value, box); });
}
function showCustSuggest(query, box){
  const q = String(query||'').trim();
  if(!q){ box.classList.remove('open'); box.innerHTML=''; return; }
  const matches = searchCustomers(q).slice(0,6);
  let html = matches.map(c=>{
    const vehs = vehicles.filter(v=>v.customerId===c.id);
    const vehLabel = vehs.length ? vehs.map(v=>v.regNo).filter(Boolean).join('・') : '車両未登録';
    const primary = customerDisplayName(c) || '（氏名未登録）';
    return `<div class="suggest-item" onclick="pickCustomer('${esc(c.id)}')">
      <div>${esc(primary)}</div>
      <div class="si-sub">${esc(c.kana||'')} ${esc(c.tel||'')} ${esc(vehLabel)}</div>
    </div>`;
  }).join('');
  html += `<div class="suggest-item new" onclick="registerNewCustomerInline('${esc(q).replace(/'/g,"&#39;")}')">＋「${esc(q)}」を新規登録</div>`;
  box.innerHTML = html;
  box.classList.add('open');
}
function applyVehicleToState(v){
  state.vehicle = { regNo:v.regNo, carName:v.carName, modelType:v.modelType, engine:v.engine, chassisNo:v.chassisNo,
    shodo:v.shodo, regDate:v.regDate, shikiShitei:v.shikiShitei, ruibetsu:v.ruibetsu, mileage:v.mileage,
    nextShaken:v.nextShaken, nextTenken:v.nextTenken };
}
function pickCustomer(custId){
  const c = customers.find(x=>x.id===custId);
  if(!c) return;
  state.customer = { name:c.name, companyName:c.companyName||'', companyKana:c.companyKana||'', kana:c.kana||'', postal:c.postal||'', address:c.address||'', code:c.code||'', tel:c.tel||'', email:c.email||'' };
  const vehs = vehicles.filter(v=>v.customerId===custId);
  document.getElementById('custSuggest').classList.remove('open');
  if(vehs.length===1){
    applyVehicleToState(vehs[0]);
    renderCreateView();
    toast((c.name||'お客様')+'を選択しました');
  } else if(vehs.length>1){
    renderCreateView();
    showVehiclePicker(vehs);
  } else {
    renderCreateView();
    toast((c.name||'お客様')+'を選択しました（車両未登録）');
  }
}
function showVehiclePicker(vehs){
  const box = document.getElementById('custSuggest');
  if(!box) return;
  box.innerHTML = '<div class="suggest-item" style="font-weight:700;color:#666;cursor:default;">車両を選択してください</div>' +
    vehs.map(v=>`<div class="suggest-veh" onclick="pickVehicle('${esc(v.id)}')">${esc(v.regNo)||'(ナンバー未登録)'}　${esc(v.carName)}</div>`).join('');
  box.classList.add('open');
}
function pickVehicle(vehId){
  const v = vehicles.find(x=>x.id===vehId);
  if(!v) return;
  applyVehicleToState(v);
  renderCreateView();
  const box = document.getElementById('custSuggest');
  if(box) box.classList.remove('open');
  toast('車両を選択しました（'+(v.regNo||'')+'）');
}
function registerNewCustomerInline(name){
  if(!name) return;
  const code = nextCustomerCode();
  const c = { id: genId('c', customers), name, companyName:'', companyKana:'', kana:'', tel:'', postal:'', address:'', code, email:'' };
  customers.push(c);
  saveCustomersToStorage();
  state.customer = { name:c.name, companyName:'', companyKana:'', kana:'', postal:'', address:'', code, tel:'', email:'' };
  renderCreateView();
  toast('「'+name+'」を新規登録しました');
}

function wireSimpleInput(id, getSetPath){
  const el = document.getElementById(id);
  if(!el) return;
  const handler = function(){
    setDeep(state, getSetPath, this.value);
    renderPreview();
  };
  el.addEventListener('input', handler);
  if(el.tagName==='SELECT') el.addEventListener('change', handler); // 一部環境でselectのinputイベントが発火しないため併用
}
function setDeep(obj, path, val){
  const parts = path.split('.');
  let o = obj;
  for(let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}
/* 郵便番号・電話番号：入力の都度ハイフンを自動整形して反映する */
function wireFormatInput(id, path, formatter){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', function(){
    const formatted = formatter(this.value);
    this.value = formatted;
    setDeep(state, path, formatted);
    renderPreview();
  });
}

/* 受付担当者・整備担当者：設定シート登録済みリストからの入力候補（サジェスト） */
function wireStaffSuggest(inputId, boxId, listGetter, statePath){
  const input = document.getElementById(inputId);
  const box = document.getElementById(boxId);
  if(!input || !box) return;
  const show = ()=>{
    const list = listGetter();
    const q = input.value.trim();
    const matches = (q ? list.filter(n=>n.indexOf(q)===0) : list).slice(0,8);
    if(matches.length===0){ box.classList.remove('open'); box.innerHTML=''; return; }
    box.innerHTML = matches.map(n=>`<div class="suggest-item" data-name="${esc(n)}">${esc(n)}</div>`).join('');
    box.classList.add('open');
  };
  input.addEventListener('input', show);
  input.addEventListener('focus', show);
  box.addEventListener('click', function(e){
    const item = e.target.closest('.suggest-item');
    if(!item) return;
    input.value = item.dataset.name;
    setDeep(state, statePath, item.dataset.name);
    box.classList.remove('open');
    renderPreview();
  });
}

/* ============================================================
   請求書PDFの共有（Web Share API・html2canvas + jsPDF）
   ============================================================ */
/* 帳票要素（#doc または .doc-box）をA4のPDF Blobに変換する */
async function generateInvoicePDFBlob(sourceEl){
  const canvas = await html2canvas(sourceEl, {scale:2, backgroundColor:'#ffffff'});
  const imgData = canvas.toDataURL('image/jpeg', 0.92); // JPEGで容量を抑え、モバイル回線での共有に配慮
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  pdf.addImage(imgData, 'JPEG', 0, 0, pw, ph);
  return pdf.output('blob');
}
/* rec: 請求書データ（state または台帳レコード）／sourceEl: キャンバス化対象のDOM要素／btnEl: 押されたボタン（ローディング表示用、省略可） */
async function shareInvoicePDF(rec, sourceEl, btnEl){
  if(!sourceEl){ toast('共有対象の帳票が見つかりませんでした'); return; }
  const invNo = (rec && rec.invNo) || '未採番';
  const origLabel = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = '作成中…'; }
  toast('PDFを作成しています…');
  try{
    const blob = await generateInvoicePDFBlob(sourceEl);
    const fileName = `御請求書_${invNo}.pdf`;
    const file = new File([blob], fileName, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'御請求書', text:'御請求書 '+invNo});
    } else {
      toast('この端末では直接共有できません。🖨印刷・PDF保存でPDFを作成してから、共有機能で送信してください');
    }
  }catch(e){
    if(!(e && e.name==='AbortError')){ // 共有シートのキャンセルは何もしない
      toast('PDFの作成に失敗しました。もう一度お試しください');
    }
  }finally{
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = origLabel; }
  }
}

}

/* ============================================================
   プレビュー拡大オーバーレイ（読み取り専用。buildDoc出力を流用）
   ============================================================ */
let dzScale = 1;
function computeFitScale(){
  const avail = window.innerHeight - 48 - 40; // バー48 + 上下パディング40
  let k = avail / 842;
  if(k < 1) k = 1;      // 実寸より小さくはしない
  if(k > 2.5) k = 2.5;
  return Math.round(k*100)/100;
}
function applyDzScale(){
  const stage = document.getElementById('dzStage');
  const doc = document.getElementById('dzDoc');
  const lbl = document.getElementById('dzLevel');
  doc.style.transform = 'scale('+dzScale+')';
  stage.style.width = (595*dzScale)+'px';
  stage.style.height = (842*dzScale)+'px';
  if(lbl) lbl.textContent = Math.round(dzScale*100)+'%';
}
function openDocZoom(s){
  const overlay = document.getElementById('docZoom');
  document.getElementById('dzDoc').innerHTML = buildDoc(s);
  dzScale = computeFitScale();
  applyDzScale();
  document.getElementById('dzScroll').scrollTop = 0;
  overlay.classList.add('open');
  document.addEventListener('keydown', dzKeyHandler);
}
function dzZoom(delta){
  dzScale = Math.min(3, Math.max(0.6, Math.round((dzScale+delta)*100)/100));
  applyDzScale();
}
function closeDocZoom(){
  document.getElementById('docZoom').classList.remove('open');
  document.getElementById('dzDoc').innerHTML = '';
  document.removeEventListener('keydown', dzKeyHandler);
}
function dzKeyHandler(e){ if(e.key==='Escape') closeDocZoom(); }

function saveInvoiceToLedger(){
  if(!state.invNo){ toast('伝票Noを入力してください'); return; }
  upsertCustomerAndVehicle(state.customer, state.vehicle);
  const record = JSON.parse(JSON.stringify(state));
  record.savedAt = new Date().toISOString();
  record.totals = computeTotals(state);
  const idx = ledger.findIndex(r=>r.invNo===record.invNo);
  if(idx>=0) ledger[idx] = record; else ledger.unshift(record);
  saveLedgerToStorage();
  toast('台帳に保存しました（伝票No '+record.invNo+'）');
}
function loadInvoiceToForm(invNo){

function sortCustomersForDisplay(list){
  const companies = list.filter(c=>c.companyName);
  const individuals = list.filter(c=>!c.companyName);
  const byKana = getKanaFns => (a,b)=>{
    const ka = toHiragana(getKanaFns(a));
    const kb = toHiragana(getKanaFns(b));
    return ka.localeCompare(kb, 'ja');
  };
  companies.sort(byKana(c=>c.companyKana || c.companyName || ''));
  individuals.sort(byKana(c=>c.kana || c.name || ''));
  return [...companies, ...individuals];
}
function renderCustomerList(query){

    return;
  }
  area.innerHTML = list.map(c=>{
    const vehs = vehicles.filter(v=>v.customerId===c.id);
    const tags = vehs.map(v=>{
      const soon = isShakenSoon(v.nextShaken);

/* 検索クエリと一致する車両（登録番号・車台番号・型式指定・類別区分番号）をその顧客の中から探す。複数一致する場合は先頭を採用。 */
function findMatchingVehicle(customerId, query){
  const q = String(query||'').trim();
  if(!q) return null;
  return vehicles.find(v => v.customerId===customerId && (
    (v.regNo && v.regNo.includes(q)) ||
    (v.chassisNo && v.chassisNo.includes(q)) ||
    (v.shikiShitei && v.shikiShitei.includes(q)) ||
    (v.ruibetsu && v.ruibetsu.includes(q))
  )) || null;
}

}

  selectedCustomerId = id;

  const match = findMatchingVehicle(id, q);

  expandedCustLedgerInvNo = null;

function buildCustomerDetailHTML(c){
  const vehs = vehicles.filter(v=>v.customerId===c.id);
  if(!vehs.some(v=>v.id===selectedVehicleId)){
    selectedVehicleId = vehs.length ? vehs[0].id : null; // 顧客切替時は原則1台目を初期選択
  }
  let html = `
  <div class="fsec">
    <h2>顧客情報</h2>
    <div class="frow"><label>会社名（個人名）</label><input type="text" id="cd-companyName" placeholder="法人の場合の会社名、個人の場合は個人名" value="${esc(c.companyName||'')}"></div>
    <div class="frow"><label>会社名かな</label><input type="text" id="cd-companyKana" placeholder="検索・並び替え用（任意）" value="${esc(c.companyKana||'')}"></div>
    <div class="frow"><label>宛名（担当者名）</label><input type="text" id="cd-name" value="${esc(c.name)}"></div>
    <div class="frow"><label>かな</label><input type="text" id="cd-kana" value="${esc(c.kana||'')}"></div>
    <div class="frow2">
      <div class="frow"><label>電話</label><input type="text" id="cd-tel" value="${esc(c.tel||'')}"></div>
      <div class="frow"><label>お客様コード</label><input type="text" id="cd-code" value="${esc(c.code||'')}"></div>
    </div>
    <div class="frow"><label>郵便番号</label><input type="text" id="cd-postal" value="${esc(c.postal||'')}"></div>
    <div class="frow"><label>住所</label><input type="text" id="cd-address" value="${esc(c.address||'')}"></div>
    <div class="frow"><label>メール</label><input type="text" id="cd-email" placeholder="車検リマインドのメール送信に使用" value="${esc(c.email||'')}"></div>
    <div class="action-bar"><button class="save" style="flex:none; padding:8px 16px;" onclick="deleteCustomer('${esc(c.id)}')">🗑 この顧客を削除</button></div>
  </div>
  `;

  if(vehs.length===0){
    html += `
    <div class="fsec" style="text-align:center; color:#999; padding:24px 16px;">
      車両未登録<br>
      <button class="add-row-btn" style="margin-top:12px;" onclick="addVehicleToCustomer('${esc(c.id)}')">＋ 車両を追加</button>
    </div>`;
    return html;
  }

  html += `<div class="veh-tabs" id="vehTabs">`;
  vehs.forEach((v,i)=>{
    html += `<button class="${v.id===selectedVehicleId?'active':''}" onclick="selectVehicleTab('${esc(v.id)}')">${esc(vehTabLabel(v,i))}</button>`;
  });
  html += `<button class="add-veh-tab" onclick="addVehicleToCustomer('${esc(c.id)}')">＋ 車両を追加</button></div>`;

  const selVeh = vehs.find(v=>v.id===selectedVehicleId);
  if(selVeh){
    html += buildVehicleDetailHTML(selVeh);
    html += buildVehicleLedgerHTML(selVeh);
  }
  return html;
}
/* 車両タブ切替。選択中の請求書プレビューはリセットして描画し直す。 */
function selectVehicleTab(vehId){
  selectedVehicleId = vehId;
  expandedCustLedgerInvNo = null;
  renderCustomerDetailPane();
}
/* 車両1台分の過去請求書一覧（登録番号で紐付け）。「開く」でその場にA4プレビューを展開する。 */
function buildVehicleLedgerHTML(v){
  if(!v.regNo){
    return `<div class="fsec"><h2>過去の請求書</h2><div style="color:#999; font-size:12px;">登録番号が未登録のため過去データを紐付けできません</div></div>`;
  }
  const recs = ledger.filter(r=>r.vehicle && r.vehicle.regNo===v.regNo)
    .sort((a,b)=>(b.invNo||'').localeCompare(a.invNo||''));
  let html = `<div class="fsec"><h2>過去の請求書</h2>`;
  if(recs.length===0){
    html += `<div style="color:#999; font-size:12px;">この車両の過去請求書はありません</div>`;
  } else {
    html += `<div class="ledger-scroll"><table class="ledger-table"><tr><th>伝票No</th><th>発行日</th><th>種別</th><th>請求額</th><th>操作</th></tr>`;
    recs.forEach(r=>{
      const total = r.totals ? r.totals.seikyu : computeTotals(r).seikyu;
      const isOpen = r.invNo === expandedCustLedgerInvNo;
      html += `<tr>
        <td>${esc(r.invNo)}</td>
        <td>${toWarekiShort(r.issueDate)||''}</td>
        <td>${esc(r.type)}</td>
        <td class="amt">¥${yen(total)}</td>
        <td class="ledger-actions"><button class="${isOpen?'active':''}" onclick="toggleCustLedgerPreview('${esc(r.invNo)}')">${isOpen?'閉じる':'開く'}</button></td>
      </tr>`;
      if(isOpen){
        html += `<tr class="ledger-preview-row"><td colspan="5">
          <div class="ledger-preview-wrap">
            <div class="doc-box">${buildDoc(r)}</div>
            <div class="ledger-preview-actions">
              <button class="save" onclick="loadInvoiceToForm('${esc(r.invNo)}')">✏️ この内容を編集</button>
              <button class="zoom" onclick="openLedgerZoom('${esc(r.invNo)}')">🔍 拡大</button>
              <button class="print" onclick="printLedgerRecord('${esc(r.invNo)}')">🖨 印刷・PDF保存</button>
              <button class="share" onclick="shareCustLedgerRecord('${esc(r.invNo)}', this)">📤 共有</button>
            </div>
          </div>
        </td></tr>`;
      }
    });
    html += `</table></div>`;
  }
  html += `</div>`;
  return html;
}
function toggleCustLedgerPreview(invNo){
  expandedCustLedgerInvNo = (expandedCustLedgerInvNo === invNo) ? null : invNo;
  renderCustomerDetailPane();
}

function wireCustomerDetail(c){
  ['companyName','name','code','address','email'].forEach(key=>{
    const el = document.getElementById('cd-'+key);
    if(!el) return;
    el.addEventListener('input', function(){
      c[key] = this.value;
      saveCustomersToStorage();
      const searchInput = document.getElementById('custSearchInput');
      renderCustomerList(searchInput ? searchInput.value : '');
    });
  });
  const companyKanaEl = document.getElementById('cd-companyKana');
  if(companyKanaEl) companyKanaEl.addEventListener('input', function(){
    const kana = toKatakana(this.value);
    this.value = kana;
    c.companyKana = kana;
    saveCustomersToStorage();
    const searchInput = document.getElementById('custSearchInput');
    renderCustomerList(searchInput ? searchInput.value : '');
  });
  const kanaEl = document.getElementById('cd-kana');
  if(kanaEl) kanaEl.addEventListener('input', function(){
    const kana = toKatakana(this.value);
    this.value = kana;
    c.kana = kana;
    saveCustomersToStorage();
    const searchInput = document.getElementById('custSearchInput');
    renderCustomerList(searchInput ? searchInput.value : '');
  });
  const postalEl = document.getElementById('cd-postal');
  if(postalEl) postalEl.addEventListener('input', function(){
    const v = formatPostal(this.value);
    this.value = v;
    c.postal = v;
    saveCustomersToStorage();
  });
  const telEl = document.getElementById('cd-tel');
  if(telEl) telEl.addEventListener('input', function(){
    const v = formatPhone(this.value);
    this.value = v;
    c.tel = v;
    saveCustomersToStorage();
    const searchInput = document.getElementById('custSearchInput');
    renderCustomerList(searchInput ? searchInput.value : '');
  });
  document.querySelectorAll('.vfield').forEach(el=>{
    el.addEventListener('input', function(){
      const v = vehicles.find(x=>x.id===this.dataset.veh);
      if(!v) return;
      v[this.dataset.key] = this.value;
      saveVehiclesToStorage();
      if(this.dataset.key==='regNo' || this.dataset.key==='nextShaken'){
        const searchInput = document.getElementById('custSearchInput');
        renderCustomerList(searchInput ? searchInput.value : '');
      }
    });
    /* タブラベル・過去請求書一覧はregNo/carNameに依存するため、入力中の再描画（フォーカス喪失）を避けてblur時のみ更新する */
    el.addEventListener('change', function(){
      if(this.dataset.key==='regNo' || this.dataset.key==='carName'){
        const pane = document.getElementById('custDetailPane');
        pane.innerHTML = buildCustomerDetailHTML(c);
        wireCustomerDetail(c);
      }
    });
  });
}
function deleteCustomer(id){
  const vehs = vehicles.filter(v=>v.customerId===id);
  const msg = vehs.length
    ? `この顧客を削除しますか？紐づく車両${vehs.length}件も削除されます。`
    : 'この顧客を削除しますか？';
  if(!confirm(msg)) return;
  customers = customers.filter(c=>c.id!==id);
  vehicles = vehicles.filter(v=>v.customerId!==id);
  saveCustomersToStorage();
  saveVehiclesToStorage();
  selectedCustomerId = null;
  selectedVehicleId = null;
  expandedCustLedgerInvNo = null;
  renderCustomersView();
  toast('削除しました');
}
function addVehicleToCustomer(customerId){
  const v = { id: genId('v', vehicles), customerId, regNo:'', carName:'', modelType:'', engine:'', chassisNo:'',
    shodo:'', regDate:'', shikiShitei:'', ruibetsu:'', mileage:'', nextShaken:'', nextTenken:'' };
  vehicles.push(v);
  saveVehiclesToStorage();
  selectedCustomerId = customerId;
  selectedVehicleId = v.id; // 追加した車両のタブを自動選択
  expandedCustLedgerInvNo = null;
  renderCustomerDetailPane();
  toast('車両を追加しました');
}
function deleteVehicle(id){
  if(!confirm('この車両を削除しますか？')) return;
  const v = vehicles.find(x=>x.id===id);
  vehicles = vehicles.filter(x=>x.id!==id);
  saveVehiclesToStorage();
  if(selectedVehicleId===id) selectedVehicleId = null; // buildCustomerDetailHTML側で1台目にフォールバック
  if(v){
    selectedCustomerId = v.customerId;
    expandedCustLedgerInvNo = null;
    renderCustomerDetailPane();
  }
  toast('車両を削除しました');
}

/* ============================================================
   車検リマインドビュー
   ============================================================ */
let reminderPeriodMode = '3m';
let reminderPeriodDays = 90;
function buildReminderRowsHTML(targets){
  if(targets.length===0){
    return '<tr><td colspan="5" class="reminder-empty">対象期間に車検予定のお客様はいません</td></tr>';
  }
  return targets.map(({v,c,diffDays})=>{
    const overdue = diffDays<0;
    const daysLabel = overdue ? `${Math.abs(diffDays)}日超過` : `あと${diffDays}日`;
    const daysClass = overdue ? 'overdue' : (diffDays<=14 ? 'soon' : '');
    const tel = c && c.tel;
    const email = c && c.email;
    return `<tr class="${overdue?'overdue':''}">
      <td>${esc(c && c.name)||'（氏名未登録）'}</td>
      <td>${esc(v.carName)||''}　${esc(v.regNo)||''}</td>
      <td>${toWarekiShort(v.nextShaken)||''}</td>
      <td class="rem-days ${daysClass}">${daysLabel}</td>
      <td class="reminder-actions">
        <button ${tel?'':'disabled'} onclick="sendReminderSMS('${esc(v.id)}')">SMS</button>
        <button ${email?'':'disabled'} onclick="sendReminderMail('${esc(v.id)}')">メール</button>
        <button onclick="sendReminderLine('${esc(v.id)}')">LINE</button>
        <button onclick="copyReminderMsg('${esc(v.id)}')">コピー</button>
      </td>
    </tr>`;
  }).join('');
}
function renderReminderRowsOnly(){
  const rowsEl = document.getElementById('reminderRows');
  if(!rowsEl) return;
  rowsEl.innerHTML = buildReminderRowsHTML(getReminderTargets(reminderPeriodDays));
}
function renderReminderView(){
  const body = document.getElementById('reminderBody');
  const rowsHTML = buildReminderRowsHTML(getReminderTargets(reminderPeriodDays));
  body.innerHTML = `
    <div class="reminder-controls">
      <div class="seg" id="reminderSeg">
        <button data-mode="2m" class="${reminderPeriodMode==='2m'?'active':''}">2ヶ月</button>
        <button data-mode="3m" class="${reminderPeriodMode==='3m'?'active':''}">3ヶ月</button>
        <button data-mode="6m" class="${reminderPeriodMode==='6m'?'active':''}">半年</button>
        <button data-mode="custom" class="${reminderPeriodMode==='custom'?'active':''}">任意</button>
      </div>
      <div class="reminder-custom" id="reminderCustomWrap" style="${reminderPeriodMode==='custom'?'':'display:none;'}">
        <input type="number" id="reminderCustomDays" min="1" value="${reminderPeriodDays}"> 日以内
      </div>
    </div>
    <table class="reminder-table">
      <tr><th>顧客名</th><th>車両</th><th>次回車検日</th><th>残日数</th><th>送信</th></tr>
      <tbody id="reminderRows">${rowsHTML}</tbody>
    </table>
  `;
  document.getElementById('reminderSeg').addEventListener('click', function(e){
    const btn = e.target.closest('button[data-mode]');
    if(!btn) return;
    reminderPeriodMode = btn.dataset.mode;
    if(reminderPeriodMode==='2m') reminderPeriodDays = 60;
    else if(reminderPeriodMode==='3m') reminderPeriodDays = 90;
    else if(reminderPeriodMode==='6m') reminderPeriodDays = 180;
    renderReminderView();
  });
  const customInput = document.getElementById('reminderCustomDays');
  if(customInput){
    customInput.addEventListener('input', function(){
      reminderPeriodDays = Number(this.value)||1;
      renderReminderRowsOnly();
    });
  }
}

  bind('s-name','name'); bind('s-kikan','kikan'); bind('s-rep','rep'); bind('s-repTitle','repTitle');
  bind('s-address','address'); bind('s-invoiceNo','invoiceNo');
  const bindFormatted = (id, key, formatter) => {
    document.getElementById(id).addEventListener('input', function(){
      const v = formatter(this.value);
      this.value = v;
      shop[key] = v;
      saveShop();
    });
  };
  bindFormatted('s-postal','postal', formatPostal);
  bindFormatted('s-tel','tel', formatPhone);
  bindFormatted('s-fax','fax', formatPhone);

  document.getElementById('s-startNo').addEventListener('input', function(){
    shop.startNo = Number(this.value)||1;
    saveShop();
  });
  document.getElementById('s-template').addEventListener('input', function(){
    templates.shakenReminder = this.value;
    saveTemplatesToStorage();
  });

  /* 担当者リスト（受付・整備）の編集・追加・削除 */
  document.querySelectorAll('.staff-field').forEach(el=>{
    el.addEventListener('input', function(){
      shop[this.dataset.list][Number(this.dataset.idx)] = this.value;
      saveShop();
    });
  });
  document.querySelectorAll('[data-action="add-staff"]').forEach(btn=>{
    btn.addEventListener('click', function(){
      shop[this.dataset.list].push('');
      saveShop();
      renderSettingsView();
    });
  });
  document.querySelectorAll('[data-action="del-staff"]').forEach(btn=>{
    btn.addEventListener('click', function(){
      shop[this.dataset.list].splice(Number(this.dataset.idx),1);
      saveShop();
      renderSettingsView();
    });
  });

  /* 振込先（複数登録可）の編集・追加・削除 */
  document.querySelectorAll('.bank-field').forEach(el=>{
    el.addEventListener('input', function(){
      shop.bankAccounts[Number(this.dataset.idx)][this.dataset.key] = this.value;
      saveShop();
    });
  });
  const addBankBtn = document.getElementById('btnAddBank');
  if(addBankBtn) addBankBtn.addEventListener('click', function(){
    shop.bankAccounts.push({ label:'', bankName:'', branch:'', accType:'', accNo:'', holder:'' });
    saveShop();
    renderSettingsView();
  });
  document.querySelectorAll('[data-action="del-bank"]').forEach(btn=>{
    btn.addEventListener('click', function(){
      /* 振込先は最低1件残す。削除前に必ず確認を取る（破壊的操作のため） */
      if(shop.bankAccounts.length<=1){ toast('振込先は最低1件必要です'); return; }
      if(!confirm('この振込先を削除しますか？')) return;
      shop.bankAccounts.splice(Number(this.dataset.idx),1);
      saveShop();
      renderSettingsView();
    });
  });

  document.getElementById('btnBackup').addEventListener('click', backupJSON);
  document.getElementById('btnRestore').addEventListener('click', ()=>document.getElementById('restoreFile').click());
  document.getElementById('restoreFile').addEventListener('change', restoreJSON);
}
function renderSettingsView(){
  document.getElementById('settingsBody').innerHTML = buildSettingsHTML();
  wireSettings();
}
async function backupJSON(){
  const data = { shop, ledger, customers, vehicles, templates, exportedAt: new Date().toISOString() };
  const json = JSON.stringify(data,null,2);
  const fileName = `ケンズオート_バックアップ_${todayISO()}.json`;
  /* 共有シートに対応した端末では、共有先としてGoogleドライブ等を選んで保存できるようにする */
  const file = new File([json], fileName, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'ケンズオート バックアップ', text:'ケンズオートのバックアップデータです'});
      storeSet('ken_lastbackup', new Date().toISOString());
      toast('共有シートからバックアップを保存してください');
      return;
    }catch(e){
      if(e && e.name==='AbortError') return; // 共有シートのキャンセルは何もしない
      // 共有に失敗した場合は下のダウンロード方式にフォールバックする
    }
  }
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
  storeSet('ken_lastbackup', new Date().toISOString());
  toast('バックアップを書き出しました');
}
function restoreJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if(data.shop) shop = Object.assign(defaultShop(), data.shop);
      if(data.ledger) ledger = data.ledger;
      if(data.customers) customers = data.customers;
      if(data.vehicles) vehicles = data.vehicles;
      if(data.templates) templates = Object.assign(defaultTemplates(), data.templates);
      saveShop();
      saveLedgerToStorage();
      saveCustomersToStorage();
      saveVehiclesToStorage();
      saveTemplatesToStorage();
      renderSettingsView();
      renderLedgerView();
      toast('復元しました');
    }catch(err){
      toast('復元に失敗しました：ファイル形式を確認してください');
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   ビュー切替
   ============================================================ */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('#mainTabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='ledger') renderLedgerView();
  if(name==='customers') renderCustomersView();
  if(name==='reminder') renderReminderView();
  if(name==='settings') renderSettingsView();
}
document.getElementById('mainTabs').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  switchView(btn.dataset.view);
});
document.getElementById('btnNew').addEventListener('click', function(){
  state = defaultState();
  state.invNo = nextInvNo();
  seedItemsForType(state.type);
  itemsTouched = false;
  switchView('create');
  renderCreateView();
  toast('新規作成しました（伝票No '+state.invNo+'）');
});

/* ============================================================
   起動
   ============================================================ */
state.invNo = nextInvNo();
seedItemsForType(state.type);
itemsTouched = false;
renderCreateView();
</script>
